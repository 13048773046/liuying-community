name: community_app
description: "流萤社区 · 短视频+图文混合社区（Android/iOS 单代码库，与流萤音乐账号互通）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # HTTP 客户端
  http: ^1.2.2
  # 视频播放（Android ExoPlayer / iOS AVPlayer）
  video_player: ^2.9.2
  # 本地 token/偏好存储
  shared_preferences: ^2.3.2
  # 头像/封面/表情包图片缓存
  cached_network_image: ^3.4.1
  # 选图/选视频（发帖、视频封面）
  image_picker: ^1.1.2
  # WebSocket 实时通知
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# video_player_avfoundation 2.12+ 使用 Swift 6 语法，GitHub Actions macos-14
# runner 的 Xcode 编译不过；锁 2.11.1（Swift 5）保证 iOS 打包稳定
dependency_overrides:
  video_player_avfoundation: 2.11.1

flutter:
  uses-material-design: true
