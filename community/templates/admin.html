/* ---------------- 官方通知（富文本） ---------------- */
function officialColorToken(raw){
  const t=String(raw||"").toLowerCase().replace(/\s+/g,"");
  if(!t) return "";
  if(t==="#45e0ae"||t==="rgb(69,224,174)"||t==="rgba(69,224,174,1)") return "accent";
  if(t==="#ffb020"||t==="rgb(255,176,32)"||t==="rgba(255,176,32,1)") return "warning";
  if(t==="#ff4d4f"||t==="rgb(255,77,79)"||t==="rgba(255,77,79,1)") return "danger";
  return "";
}
function officialSpans(node,inherited){
  const out=[]; const base=inherited||{};
  const push=(text,style)=>{
    const clean=String(text||"").replace(/\u00a0/g," ");
    if(!clean) return;
    const span={text:clean};
    if(style.bold) span.bold=true;
    if(style.italic) span.italic=true;
    if(style.underline) span.underline=true;
    if(style.color) span.color=style.color;
    if(style.url) span.url=style.url;
    out.push(span);
  };
  node.childNodes.forEach(ch=>{
    if(ch.nodeType===3){ push(ch.nodeValue,base); return; }
    if(ch.nodeType!==1) return;
    const tag=ch.tagName;
    if(tag==="BR"){ push("\n",base); return; }
    if(tag==="IMG"||tag==="HR") return;
    const style={...base};
    if(tag==="STRONG"||tag==="B") style.bold=true;
    if(tag==="EM"||tag==="I") style.italic=true;
    if(tag==="U") style.underline=true;
    if(tag==="A"){
      const href=(ch.getAttribute("href")||"").trim();
      if(/^https?:\/\//i.test(href)){ style.url=href; style.underline=true; }
    }
    const color=officialColorToken((ch.style&&ch.style.color)||ch.getAttribute("color")||"");
    if(color) style.color=color;
    officialSpans(ch,style).forEach(x=>out.push(x));
  });
  return out;
}
function officialBlockFromElement(node,type,level){
  const spans=officialSpans(node,{});
  if(!spans.length) return null;
  const text=spans.map(x=>x.text).join("").trim();
  if(!text) return null;
  const b={type,spans};
  if(type==="heading") b.level=level||2;
  return b;
}
// contenteditable 的软换行是 <br>；富文本模型以“块”表达换行。
// 这里把同一段里的 <br> 拆成多个块，避免发布后两行文字粘成一行。
function officialInlineBlocks(node,type,level){
  const runs=[]; let frag=document.createDocumentFragment();
  [...node.childNodes].forEach(ch=>{
    if(ch.nodeType===1 && ch.tagName==="BR"){
      runs.push(frag); frag=document.createDocumentFragment(); return;
    }
    frag.appendChild(ch.cloneNode(true));
  });
  runs.push(frag);
  return runs.map(f=>officialBlockFromElement(f,type,level)).filter(Boolean);
}
function officialSerialize(){
  const root=$("#orich"); const blocks=[];
  const add=(b)=>{ if(b) blocks.push(b); };
  const walk=(node)=>{
    if(node.nodeType===3){
      const spans=officialSpans(node,{});
      if(spans.length && spans.map(x=>x.text).join("").trim()) add({type:"paragraph",spans});
      return;
    }
    if(node.nodeType!==1) return;
    const tag=node.tagName;
    if(tag==="IMG"){
      const src=(node.getAttribute("src")||"").trim();
      if(/^https?:\/\//i.test(src)) add({type:"image",url:src,alt:node.getAttribute("alt")||""});
      return;
    }
    if(tag==="HR"){ add({type:"divider"}); return; }
    if(tag==="UL"||tag==="OL"){
      [...node.children].forEach(li=>{
        if(li.tagName==="LI") officialInlineBlocks(li,"bullet").forEach(add);
      });
      return;
    }
    if(tag==="BLOCKQUOTE"){
      officialInlineBlocks(node,"quote").forEach(add);
      return;
    }
    if(/^H[1-3]$/.test(tag)){
      officialInlineBlocks(node,"heading",tag==="H3"?3:2).forEach(add);
      return;
    }
    if(tag==="DIV"||tag==="P"||tag==="SECTION"){
      const hasBlock=[...node.children].some(c=>["IMG","HR","UL","OL","BLOCKQUOTE","DIV","P","SECTION","H1","H2","H3"].includes(c.tagName));
      if(hasBlock){ node.childNodes.forEach(walk); }
      else officialInlineBlocks(node,"paragraph").forEach(add);
      return;
    }
    officialInlineBlocks(node,"paragraph").forEach(add);
  };
  root.childNodes.forEach(walk);
  return {v:1,blocks:blocks.slice(0,24)};
}

function openDlg(title, body, cls){
  $("#dlgBox").innerHTML = `<div class="mask" onclick="if(event.target===this)closeDlg()">
    <div class="dlg ${cls||""}"><h4>${esc(title)}</h4>${body}</div></div>`;
}
function closeDlg(){ $("#dlgBox").innerHTML=""; }
function err(e){ $("#view").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; }

/* ---------------- 应用市场（内嵌） ---------------- */
const APPX = {page:1, pageSize:20, status:"all", q:""};
const APPX_STATUS = {0:["草稿","t-dim"],1:["待审核","t-warn"],2:["已上架","t-ok"],3:["已拒绝","t-bad"],4:["已下架","t-dim"]};
const APPX_VER = {0:["草稿","t-dim"],1:["待审核","t-warn"],2:["已通过","t-ok"],3:["已拒绝","t-bad"]};
function appxStatusTag(s){
  const x=APPX_STATUS[Number(s)]||["未知","t-dim"];
  return `<span class="tag ${x[1]}">${x[0]}</span>`;
}
function appxVerTag(s){
  const x=APPX_VER[Number(s)]||["未知","t-dim"];
  return `<span class="tag ${x[1]}">${x[0]}</span>`;
}
function appxMedia(u){
  u=String(u||"");
  if(!u) return "";
  if(u.startsWith("/community/api/media/")) return u;
  if(/^https?:\/\//i.test(u)) return u;
  return "";
}
function appxNum(v){ return Number(v||0).toLocaleString("zh-CN"); }
function appxWhen(v){
  if(!v) return "—";
  const d=new Date(Number(v)*1000);
  return d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
}
function appxEmpty(title,text){ return `<div class="appx-empty"><b>${esc(title)}</b><div style="margin-top:4px">${esc(text||"")}</div></div>`; }

async function viewAppsDash(){
  $("#ttl").textContent="应用市场概览";
  $("#sub") && ($("#sub").textContent="运营后台 · 应用市场");
  let stats,apps,reports;
  try{
    [stats,apps,reports]=await Promise.all([
      api("GET","/admin/apps/stats"),
      api("GET","/admin/apps?page=1&pageSize=20&status=1"),
      api("GET","/admin/app-reports?status=0")
    ]);
  }catch(e){ return err(e); }
  const st=stats.stats||{};
  const total=[0,1,2,3,4].reduce((n,k)=>n+Number(st[String(k)]||0),0);
  const pending=(apps.list||[]).slice(0,6);
  const reportList=reports.list||[];
  $("#view").innerHTML=`
    <div class="card"><h3>应用市场概览</h3>
      <div class="grid">
        <div class="stat"><span>全部投稿</span><b>${appxNum(total)}</b><em class="sub">含草稿、待审与已下架</em></div>
        <div class="stat"><span>待审核</span><b>${appxNum(st["1"])}</b><em class="sub">人工审核后才可上架</em></div>
        <div class="stat"><span>已上架</span><b>${appxNum(st["2"])}</b><em class="sub">用户可搜索、下载</em></div>
        <div class="stat"><span>待处理举报</span><b>${appxNum(reportList.length)}</b><em class="sub">来自应用详情页</em></div>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr)">
      <div class="card" style="margin-bottom:0"><h3>待审核队列</h3>
        ${pending.length?pending.map(a=>`<div class="appx-report" style="align-items:center">
          ${appxMedia(a.icon)?`<img class="appx-icon" src="${esc(appxMedia(a.icon))}" alt="" loading="lazy">`:`<div class="appx-icon"></div>`}
          <div class="grow"><b>${esc(a.name)}</b><div class="appx-kv">${esc(a.packageName||"")} · ${esc(a.version&&a.version.version_name||"未填版本")} · ${esc(appxWhen(a.created))}</div></div>
          <button class="btn mini p" onclick="appxOpenDetail('${esc(a.id)}')">查看</button>
        </div>`).join(""):appxEmpty("暂无待审核投稿","新投稿会出现在这里")}
      </div>
      <div class="card" style="margin-bottom:0"><h3>最近举报</h3>
        ${reportList.length?reportList.slice(0,5).map(r=>`<div class="appx-report">
          <div class="grow"><b>${esc(r.target&&r.target.name||"应用")}</b><p>${esc(r.reason||"")}</p></div>
          <button class="btn mini" onclick="go('appReports')">处理</button>
        </div>`).join(""):appxEmpty("暂无举报","应用举报会出现在这里")}
      </div>
    </div>
    <div class="card" style="margin-top:14px"><h3>操作入口</h3>
      <div class="row"><button class="btn p" onclick="go('appsList')">应用审核</button><button class="btn" onclick="go('appsCats')">分类管理</button><button class="btn" onclick="go('appComments')">应用评论</button><button class="btn" onclick="go('appReports')">应用举报</button></div>
      <div class="hint">应用状态：草稿 / 待审核 / 已上架 / 已拒绝 / 已下架；新版本单独审核，通过后切换当前版本。</div>
    </div>`;
}

async function viewAppsList(){
  $("#ttl").textContent="应用审核";
  let data;
  try{
    const qs=new URLSearchParams({page:String(APPX.page),pageSize:String(APPX.pageSize),status:APPX.status});
    if(APPX.q) qs.set("q",APPX.q);
    data=await api("GET","/admin/apps?"+qs.toString());
  }catch(e){ return err(e); }
  const list=data.list||[];
  $("#view").innerHTML=`
    <div class="card">
      <h3>应用与审核</h3>
      <div class="appx-toolbar">
        <div class="appx-search"><svg class="appx-search-ic" viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6"/><path d="M15.5 15.5 21 21"/></svg><input id="appx-q" value="${esc(APPX.q)}" placeholder="搜索应用名或包名" onkeydown="if(event.key==='Enter')appxSearch()"></div>
        <button class="btn mini" onclick="appxSearch()">搜索</button>
        <div class="appx-seg">${[["all","全部"],["1","待审核"],["2","已上架"],["3","已拒绝"],["4","已下架"]].map(([v,t])=>`<button type="button" class="${APPX.status===v?"on":""}" onclick="appxSetStatus('${v}')">${t}</button>`).join("")}</div>
      </div>
      ${list.length?`<div style="overflow:auto"><table><thead><tr><th>应用</th><th>版本 / 包类型</th><th>分类</th><th>状态</th><th>数据</th><th style="text-align:right">操作</th></tr></thead><tbody>
        ${list.map(a=>`<tr>
          <td><div class="appx-appcell">${appxMedia(a.icon)?`<img class="appx-icon" src="${esc(appxMedia(a.icon))}" alt="" loading="lazy">`:`<div class="appx-icon"></div>`}<div style="min-width:0"><div class="appx-appname">${esc(a.name)}</div><div class="appx-appsub">${esc(a.packageName||"")} · ${esc(a.author&&a.author.name||"")}</div></div></div></td>
          <td><span class="mono">${esc(a.version&&a.version.version_name||"—")}</span><div class="appx-kv">${esc((a.packageType||"").toUpperCase())}</div></td>
          <td>${esc(a.category||"")}${a.subCategory?`<div class="appx-kv">${esc(a.subCategory)}</div>`:""}</td>
          <td>${appxStatusTag(a.status)}</td>
          <td><div class="appx-kv"><b>${appxNum(a.downloadCount)}</b> 下载</div><div class="appx-kv">${appxNum(a.ratingCount)} 评分 · ${appxNum(a.commentCount)} 评论</div></td>
          <td><div class="appx-actions"><button class="btn mini" onclick="appxOpenDetail('${esc(a.id)}')">详情</button>${Number(a.status)===1?`<button class="btn mini p" onclick="appxOpenDetail('${esc(a.id)}')">审核</button>`:""}</div></td>
        </tr>`).join("")}</tbody></table></div>
        <div class="row" style="justify-content:space-between;margin-top:12px"><span class="hint">共 ${appxNum(data.total)} 条 · 第 ${data.page} 页</span><div class="row" style="margin:0"><button class="btn mini" onclick="appxPage(-1)" ${data.page<=1?"disabled":""}>上一页</button><button class="btn mini" onclick="appxPage(1)" ${(data.page*data.pageSize)>=data.total?"disabled":""}>下一页</button></div></div>`
      :appxEmpty("没有符合条件的应用","换个状态或搜索词试试")}
    </div>`;
}
function appxSearch(){ APPX.q=($("#appx-q")||{}).value||""; APPX.page=1; viewAppsList(); }
function appxSetStatus(v){ APPX.status=v; APPX.page=1; viewAppsList(); }
function appxPage(d){ APPX.page=Math.max(1,APPX.page+Number(d||0)); viewAppsList(); }

async function viewAppsCats(){
  $("#ttl").textContent="应用分类";
  let data;
  try{ data=await api("GET","/admin/app-categories"); }catch(e){ return err(e); }
  const list=data.list||[];
  $("#view").innerHTML=`<div class="card"><h3>分类树</h3>
    ${list.length?list.map(c=>`<div class="appx-catrow">
      <div class="grow"><div class="appx-catname">${esc(c.name)}</div><div class="appx-catslug">${esc(c.id)} · ${esc(c.slug)} · sort ${c.sort||0}</div>
      <div class="appx-catchildren">${(c.children||[]).map(ch=>`<span class="appx-catchip">${esc(ch.name)}<button onclick="appxDelCat('${esc(ch.id)}')" title="删除子分类">×</button></span>`).join("")||`<span class="hint">暂无子分类</span>`}</div></div>
      <button class="btn mini danger" onclick="appxDelCat('${esc(c.id)}')">删除大类</button>
    </div>`).join(""):appxEmpty("暂无分类","请先添加应用大类")}
    <div class="appx-addcat">
      <div><label>父级</label><select id="appx-cat-parent"><option value="">新大类</option>${list.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div>
      <div><label>名称</label><input id="appx-cat-name" placeholder="如 工具"></div>
      <div><label>slug</label><input id="appx-cat-slug" placeholder="如 tools"></div>
      <div><label>排序</label><input id="appx-cat-sort" type="number" value="0"></div>
      <button class="btn p" onclick="appxAddCat()">添加分类</button>
    </div>
  </div>`;
}
async function appxAddCat(){
  const parentId=($("#appx-cat-parent")||{}).value||"";
  const name=String(($("#appx-cat-name")||{}).value||"").trim();
  const slug=String(($("#appx-cat-slug")||{}).value||"").trim();
  const sort=Number(($("#appx-cat-sort")||{}).value||0);
  if(!name) return toast("分类名必填",1);
  try{ await api("POST","/admin/app-categories",{parentId,name,slug,sort}); toast("分类已添加"); viewAppsCats(); }
  catch(e){ toast(e.message,1); }
}
async function appxDelCat(id){
  if(!confirm("确认删除该分类？删除前需无应用引用")) return;
  try{ await api("DELETE","/admin/app-categories/"+encodeURIComponent(id)); toast("分类已删除"); viewAppsCats(); }
  catch(e){ toast(e.message,1); }
}

async function viewAppComments(){
  $("#ttl").textContent="应用评论";
  let data;
  try{ data=await api("GET","/admin/app-comments?page=1&pageSize=50"); }catch(e){ return err(e); }
  const list=data.list||[];
  $("#view").innerHTML=`<div class="card"><h3>应用评论</h3>
    ${list.length?list.map(c=>`<div class="appx-comment">
      <div class="appx-comment-head"><b>${esc(c.author&&c.author.name||"用户")}</b><span>${esc(appxWhen(c.created))}</span><span class="mono">APP ${esc((c.app_id||"").slice(0,8))}</span></div>
      <div class="appx-comment-body">${esc(c.content||"")}</div>
      <div class="appx-actions" style="justify-content:flex-start;margin-top:8px"><button class="btn mini" onclick="appxHideComment('${esc(c.id)}')">隐藏评论</button></div>
    </div>`).join(""):appxEmpty("暂无可见评论","应用评论即时展示，敏感词会由接口拦截")}
  </div>`;
}
async function appxHideComment(id){
  try{ await api("POST","/admin/app-comments/"+encodeURIComponent(id),{action:"hide"}); toast("评论已隐藏"); viewAppComments(); }
  catch(e){ toast(e.message,1); }
}

async function viewAppReports(){
  $("#ttl").textContent="应用举报";
  let data;
  try{ data=await api("GET","/admin/app-reports?status=0"); }catch(e){ return err(e); }
  const list=data.list||[];
  $("#view").innerHTML=`<div class="card"><h3>待处理举报 <span class="badge">${list.length}</span></h3>
    ${list.length?list.map(r=>`<div class="appx-report">
      <div class="appx-icon" style="display:grid;place-items:center;color:var(--bad)">!</div>
      <div class="grow"><b>${esc(r.target&&r.target.name||"应用")}</b><p>${esc(r.reason||"")}</p><span class="appx-kv">${esc(appxWhen(r.created))} · 举报人 ${esc((r.user_id||"").slice(0,10))}</span></div>
      <div class="appx-actions"><button class="btn mini" onclick="appxHandleReport('${esc(r.id)}','ignore')">忽略</button><button class="btn mini danger" onclick="appxHandleReport('${esc(r.id)}','offline')">下架应用</button></div>
    </div>`).join(""):appxEmpty("暂无待处理举报","应用举报会出现在这里")}
  </div>`;
}
async function appxHandleReport(id,op){
  try{ await api("POST","/admin/app-reports/"+encodeURIComponent(id)+"/handle",{action:op}); toast(op==="offline"?"已下架应用":"已忽略举报"); viewAppReports(); }
  catch(e){ toast(e.message,1); }
}

async function appxOpenDetail(id){
  try{ const j=await api("GET","/admin/apps/"+encodeURIComponent(id)); appxRenderDetail(j.app||{}); }
  catch(e){ toast("读取详情失败："+e.message,1); }
}
function appxRenderDetail(a){
  const versions=a.versions||[];
  const pending=versions.filter(v=>Number(v.status)===1);
  const shown=pending[0]||versions.find(v=>v.id===a.current_version_id)||versions[0]||a.version||{};
  const shots=(shown.screenshots||[]).map(appxMedia).filter(Boolean);
  const canReview=pending.length>0;
  const body=`
    <div class="row" style="gap:7px">${appxStatusTag(a.status)} ${shown.status!==undefined?appxVerTag(shown.status):""}${a.featured?`<span class="tag t-acc">精选</span>`:""}</div>
    <div class="appx-detail-grid">
      <div class="appx-detail-main">
        <div class="appx-appcell" style="margin-bottom:15px">${appxMedia(a.icon)?`<img class="appx-icon" style="width:54px;height:54px;flex-basis:54px;border-radius:12px" src="${esc(appxMedia(a.icon))}" alt="">`:`<div class="appx-icon" style="width:54px;height:54px;flex-basis:54px"></div>`}<div><div style="font-size:15px;font-weight:600">${esc(a.name)}</div><div class="appx-kv">${esc(a.category||"")} / ${esc(a.subCategory||"")} · ${esc(a.packageName||"")}</div></div></div>
        <div class="appx-field"><label>应用介绍</label><div class="value pre">${esc(a.description||"未填写")}</div></div>
        <div class="appx-field"><label>投稿者分享感言</label><div class="value pre">${esc(a.shareReason||"未填写")}</div></div>
        ${shots.length?`<div class="appx-field"><label>应用截图 · ${shots.length} 张</label><div class="appx-shots">${shots.map(s=>`<img src="${esc(s)}" alt="应用截图" loading="lazy">`).join("")}</div></div>`:""}
        <div class="appx-field"><label>下载源</label><div class="appx-source">${shown.download_url?`<a href="${esc(appxMedia(shown.download_url)||shown.download_url)}" target="_blank" rel="noopener noreferrer">${esc(shown.download_url)}</a><br><span class="hint">provider: ${esc(shown.provider||"auto")} · 分享码 ${esc(shown.share_code||"无")}</span>`:"—"}</div></div>
      </div>
      <div class="appx-detail-side">
        <div class="appx-field"><label>审核与版本 · ${esc(appxWhen(a.created))} 投稿</label>
          <div style="overflow:auto"><table class="appx-version-table"><thead><tr><th>版本</th><th>状态</th><th>提交时间</th></tr></thead><tbody>${versions.map(v=>`<tr><td class="mono">${esc(v.version_name||"—")}</td><td>${appxVerTag(v.status)}</td><td class="hint">${esc(appxWhen(v.created))}</td></tr>`).join("")||`<tr><td colspan="3" class="hint">无版本</td></tr>`}</tbody></table></div>
        </div>
        ${canReview?`<div class="appx-field"><label>审核意见（拒绝时必填）</label><textarea id="appx-review-reason" class="appx-review-note" placeholder="说明问题，例如截图不清晰、包名与版本不匹配…"></textarea><div class="appx-actions" style="justify-content:flex-start"><button class="btn p" onclick="appxReview('${esc(a.id)}','${esc(pending[0].id)}','approve')">通过并上架</button><button class="btn danger" onclick="appxReview('${esc(a.id)}','${esc(pending[0].id)}','reject')">拒绝</button></div></div>`:`<div class="appx-empty" style="padding:18px"><b>没有待审核版本</b><div style="margin-top:4px">当前版本已处理或还是草稿</div></div>`}
        <div class="appx-actions" style="justify-content:flex-start;margin-top:14px">
          <button class="btn mini" onclick="appxState('${esc(a.id)}','feature')">${a.featured?"取消精选":"设为精选"}</button>
          ${Number(a.status)===4?`<button class="btn mini p" onclick="appxState('${esc(a.id)}','restore')">恢复上架</button>`:`<button class="btn mini danger" onclick="appxState('${esc(a.id)}','offline')">下架应用</button>`}
        </div>
        <div class="appx-field" style="margin-top:16px"><label>数据</label><div class="value hint">下载 ${appxNum(a.downloadCount)} · 评分 ${appxNum(a.rating)} / ${appxNum(a.ratingCount)} 人 · 收藏 ${appxNum(a.favoriteCount)} · 评论 ${appxNum(a.commentCount)}</div></div>
      </div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="closeDlg()">关闭</button></div>`;
  openDlg(a.name||"应用详情",body,"appx-detail");
}
async function appxReview(id,vid,op){
  const reason=op==="reject"?String(($("#appx-review-reason")||{}).value||"").trim():"";
  if(op==="reject"&&!reason) return toast("拒绝必须填写原因",1);
  try{ await api("POST","/admin/apps/"+encodeURIComponent(id)+"/review",{versionId:vid,action:op,reason}); toast(op==="approve"?"已通过并上架":"已拒绝"); closeDlg(); go(CURV==="appsDash"?"appsDash":"appsList"); }
  catch(e){ toast(e.message,1); }
}
async function appxState(id,op){
  try{ await api("POST","/admin/apps/"+encodeURIComponent(id)+"/state",{action:op}); toast("状态已更新"); closeDlg(); go(CURV==="appsDash"?"appsDash":"appsList"); }
  catch(e){ toast(e.message,1); }
}

/* ---------------- 启动 ---------------- */
function defaultView(){
  if(can("data")) return "dash";
  if(can("content")) return "audit";
  if(can("comments")) return "comments";
  if(can("feedback")) return "feedback";
  if(can("users")) return "userlist";
  if(can("ops")) return "boards";
  if(can("apps")) return "appsDash";
  if(can("admins")) return "admins";
  return "dash";
}

(async function init(){
  if(TOK){
    try{
      await loadMe();
      renderNav();
      $("#who").textContent = identityText();
      go(hashedView() || defaultView());
      return;
    }catch(e){ /* 令牌失效走登录 */ }
  }
  ME = {role:"", perms:[], name:""};
  renderNav();
  showLogin();
})();
</script>
