<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流萤社区 · 管理后台</title>
<style>
:root{
  --bg:#05080f; --bg2:#080d18; --panel:#0c1322; --panel2:#101a2b;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --fg:#e9eefc; --dim:#8fa0c2; --dim2:#6a7a99;
  --acc:#7b6cff; --acc2:#3ee0ff;
  --ok:#3ae0a4; --warn:#ffcb52; --bad:#ff6a86;
  --shadow:0 16px 40px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#05080f}
body{
  color:var(--fg);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(900px 520px at 8% -10%, rgba(123,108,255,.18), transparent 62%),
    radial-gradient(760px 420px at 96% -6%, rgba(62,224,255,.12), transparent 58%),
    linear-gradient(180deg,#070c16 0%, #05070e 55%, #04060c 100%);
  background-attachment:fixed;
}
a{color:var(--acc2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

/* ---------- 进度条 ---------- */
#prog{position:fixed;top:0;left:0;height:2px;width:0;z-index:140;opacity:0;
      background:linear-gradient(90deg,var(--acc),var(--acc2));
      box-shadow:0 0 12px rgba(123,108,255,.7);transition:width .3s var(--ease),opacity .35s}

/* ---------- 外框 ---------- */
.wrap{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
      padding:16px 12px 12px;gap:8px;background:rgba(9,14,24,.72);backdrop-filter:blur(16px);
      border-right:1px solid var(--line);overflow:auto;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;border-bottom:1px solid var(--line)}
.logo .ic{width:38px;height:38px;border-radius:12px;flex:0 0 38px;display:grid;place-items:center;
          font-size:19px;color:#fff;font-weight:600;
          background:linear-gradient(135deg,#7b6cff,#3ee0ff);
          box-shadow:0 8px 24px rgba(110,110,255,.45),inset 0 1px 0 rgba(255,255,255,.45)}
.logo .lt b{display:block;font-size:15px;letter-spacing:.02em}
.logo .lt small{display:block;color:var(--dim2);font-size:11px;font-weight:400;letter-spacing:.03em}
.nav{flex:1;overflow:auto;padding:6px 0 10px}
.nav a{position:relative;display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;margin-bottom:2px;
       border-radius:10px;color:#c2cde4;text-decoration:none;font-size:13px;overflow:hidden;
       transition:background .2s,color .2s,transform .2s var(--ease)}
.nav a::before{content:"";width:5px;height:5px;border-radius:50%;flex:0 0 5px;
               background:rgba(255,255,255,.24);transition:background .2s,box-shadow .2s,transform .2s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff;transform:translateX(2px)}
.nav a:hover::before{background:var(--acc2)}
.nav a.on{color:#fff;font-weight:600;transform:none;
          background:linear-gradient(90deg,rgba(123,108,255,.26),rgba(62,224,255,.07) 70%,transparent);
          box-shadow:inset 0 0 0 1px rgba(123,108,255,.32),0 6px 18px rgba(123,108,255,.16)}
.nav a.on::before{background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
.nav .grp{color:var(--dim2);font-size:11px;letter-spacing:.14em;padding:16px 10px 6px;text-transform:uppercase}
.side-foot{color:var(--dim2);font-size:11px;text-align:center;padding:8px 0 2px;border-top:1px solid var(--line)}

.main{flex:1;min-width:0;padding:0 28px 40px;max-width:1400px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
     padding:24px 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line);
     background:linear-gradient(180deg,rgba(5,8,15,.92),rgba(5,8,15,.55) 70%,transparent);
     backdrop-filter:blur(10px)}
.top h1{font-size:23px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
.top .sub{color:var(--dim2);font-size:12px;margin-top:3px;letter-spacing:.04em}
.top .who{color:var(--dim);font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:7px;
          padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.top .who:empty{display:none}
.top .who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);
                  box-shadow:0 0 8px rgba(58,224,164,.8)}

/* ---------- 卡片 ---------- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
      border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.22);transition:border-color .25s,transform .25s var(--ease),box-shadow .25s}
.card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;
              background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent)}
.card:hover{border-color:rgba(123,108,255,.26);box-shadow:0 16px 40px rgba(0,0,0,.32)}
.card h3{font-size:14px;font-weight:600;color:#fff;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h3::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
.aib-plans{grid-template-columns:repeat(3,minmax(0,1fr))}
.aib-plan{min-width:0}
.aib-plan .aib-last{font-size:12px;color:var(--dim);line-height:1.55;overflow-wrap:anywhere}
.aib-plan .row{flex-direction:row!important;flex-wrap:nowrap!important;align-items:flex-start!important}
.aib-log-table{table-layout:fixed;width:100%}
.aib-log-table th:nth-child(1),.aib-log-table td:nth-child(1){width:150px}
.aib-log-table th:nth-child(2),.aib-log-table td:nth-child(2){width:112px;white-space:nowrap}
.aib-log-table th:nth-child(3),.aib-log-table td:nth-child(3){width:34%}
.aib-log-table th:nth-child(4),.aib-log-table td:nth-child(4){width:25%}
.aib-log-table th:nth-child(5),.aib-log-table td:nth-child(5){width:136px;white-space:nowrap}
.aib-log-table td{vertical-align:top;overflow-wrap:anywhere}
.site-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.site-fields .row{margin-bottom:8px}
.site-thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line);background:#0b1420;flex:0 0 34px}



/* ---------- 热更新配置中心 ---------- */
.hot-hero{border-color:rgba(62,224,255,.24);
  background:linear-gradient(135deg,rgba(62,224,255,.16),rgba(123,108,255,.1) 55%,rgba(255,255,255,.02))}
.hot-hero::after{background:radial-gradient(circle,rgba(62,224,255,.24),transparent 68%)}
.hot-master{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:15px 17px;border-radius:14px;border:1px solid rgba(62,224,255,.16);
  background:linear-gradient(120deg,rgba(62,224,255,.075),rgba(255,255,255,.02))}
.hot-master-main{display:flex;align-items:center;gap:12px;min-width:0}
.hot-master-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px rgba(58,224,164,.9)}
.hot-master-dot.off{background:#ff7a90;box-shadow:0 0 12px rgba(255,90,120,.8)}
.hot-master b{display:block;font-size:13.5px;color:#fff}
.hot-master small{display:block;color:var(--dim2);font-size:11px;line-height:1.6;margin-top:2px}
.hot-actions{display:flex;flex-wrap:wrap;gap:8px}
.hot-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:14px}
.hot-quick button{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:13px 14px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);text-align:left;cursor:pointer;
  transition:transform .2s var(--ease),border-color .2s,background .2s}
.hot-quick button:hover{transform:translateY(-2px);border-color:rgba(62,224,255,.3);background:rgba(62,224,255,.05)}
.hot-quick b{font-size:12.5px}
.hot-quick span{font-size:10.5px;color:var(--dim2);line-height:1.45}
.hot-quick .ico{font-size:15px;line-height:1;color:var(--acc2)}
.hot-list{display:flex;flex-direction:column;gap:8px}
.hot-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:13px;align-items:center;
  padding:12px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.025)}
.hot-row:hover{border-color:rgba(62,224,255,.22);background:rgba(255,255,255,.04)}
.hot-row-key{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.hot-row-key code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#d9e8ff;
  padding:3px 7px;border-radius:6px;background:rgba(62,224,255,.08);border:1px solid rgba(62,224,255,.13)}
.hot-row-main{min-width:0}
.hot-row-main p{margin:0;color:var(--dim);font-size:11.5px;line-height:1.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-row-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;color:var(--dim2);font-size:10.5px}
.hot-row-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.hot-empty{padding:26px 12px;text-align:center;color:var(--dim2);font-size:12px;line-height:1.8}
.hot-form{overflow:hidden}
.hot-form .apprel-form-head{align-items:center}
.hot-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.hot-form-grid .row{margin-bottom:9px}
.hot-form-grid .row>label{min-width:92px}
.hot-sec{padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.055);background:rgba(0,0,0,.12);margin-top:4px}
.hot-sec h4{display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;margin:0 0 10px}
.hot-sec h4::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--acc2)}
.hot-check{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12.5px}
.hot-check input{width:auto;flex:0 0 auto}
.hot-check span{color:var(--dim2);font-size:11px}
.hot-flags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.hot-flags .hot-check{margin:0;padding:9px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.02)}
.hot-json{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;min-height:150px}
.hot-hist{display:flex;flex-direction:column;gap:8px}
.hot-hist-row{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;
  border-radius:10px;border:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.02)}
.hot-hist-row b{font-size:11px;color:#fff}
.hot-hist-row small{display:block;color:var(--dim2);font-size:10.5px}
.hot-hist-row p{margin:0;color:var(--dim);font-size:11px;line-height:1.45;max-height:38px;overflow:hidden;word-break:break-all}
.hot-preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.hot-preview-grid .row{margin:0}
.hot-preview-pre{max-height:48vh;overflow:auto;margin:0;padding:12px;border-radius:10px;background:#070b12;
  border:1px solid var(--line);color:#bcd2ff;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
@media(max-width:720px){
  .hot-quick{grid-template-columns:1fr 1fr}
  .hot-row{grid-template-columns:1fr;gap:8px}
  .hot-row-actions{justify-content:flex-start}
  .hot-form-grid{grid-template-columns:1fr}
  .hot-flags{grid-template-columns:1fr 1fr}
  .hot-preview-grid{grid-template-columns:1fr}
  .hot-hist-row{grid-template-columns:1fr;gap:5px}
  .apprel-hero{grid-template-columns:1fr}
}
/* ---------- 客户端版本 ---------- */
.apprel-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;
  padding:23px 24px 22px;border-color:rgba(123,108,255,.24);
  background:linear-gradient(135deg,rgba(123,108,255,.2),rgba(62,224,255,.08) 52%,rgba(255,255,255,.02))}
.apprel-hero::after{content:"";position:absolute;right:-70px;top:-110px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(62,224,255,.25),transparent 68%);pointer-events:none}
.apprel-hero-copy{position:relative;z-index:1;min-width:0}
.apprel-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;color:#aeb9e8;font-weight:600}
.apprel-eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc2);box-shadow:0 0 10px var(--acc2)}
.apprel-hero h2{margin-top:7px;font-size:31px;line-height:1.18;letter-spacing:-.8px;font-weight:700}
.apprel-hero h2 em{font-style:normal;background:linear-gradient(110deg,#fff,#c8d2ff 55%,#8eeaff);-webkit-background-clip:text;background-clip:text;color:transparent}
.apprel-hero p{max-width:610px;margin-top:9px;color:var(--dim);font-size:12.5px;line-height:1.75}
.apprel-metrics{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;color:var(--dim2);font-size:11.5px}
.apprel-metrics b{color:#fff;font-size:17px;font-weight:650;margin-right:3px;font-variant-numeric:tabular-nums}
.apprel-hero-side{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.apprel-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.apprel-card{position:relative;min-width:0;padding:17px 18px 15px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:0 10px 28px rgba(0,0,0,.25);overflow:hidden}
.apprel-card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}
.apprel-card.android{border-color:rgba(58,224,164,.18)}
.apprel-card.ios{border-color:rgba(123,108,255,.2)}
.apprel-card-empty{border-style:dashed;background:rgba(255,255,255,.025)}
.apprel-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.apprel-pf{display:flex;align-items:center;gap:9px;min-width:0}
.apprel-pf b{display:block;font-size:13.5px;line-height:1.3}
.apprel-pf small{display:block;color:var(--dim2);font-size:10.5px;letter-spacing:.06em}
.apprel-mark{width:31px;height:31px;flex:0 0 31px;border-radius:10px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:14px;background:linear-gradient(135deg,#7b6cff,#3ee0ff);
  box-shadow:0 6px 16px rgba(90,120,255,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.apprel-mark.android{background:linear-gradient(135deg,#28c98d,#68e8bd)}
.apprel-mark.ios{background:linear-gradient(135deg,#7b6cff,#3ee0ff)}
.apprel-tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.apprel-big{margin-top:13px;font-size:29px;line-height:1.15;font-weight:700;letter-spacing:-.7px}
.apprel-big span{display:inline-block;margin-left:6px;vertical-align:middle;font-size:10.5px;font-weight:500;letter-spacing:0;color:var(--dim2);
  border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.04)}
.apprel-meta{margin-top:4px;color:var(--dim);font-size:11.5px}
.apprel-url{margin-top:8px;padding:7px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.14);
  color:#9fb1d0;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apprel-card-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.apprel-empty-copy{margin-top:17px;color:var(--dim2);font-size:12px;line-height:1.8}
.apprel-form-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:13px}
.apprel-form-head h3{margin-bottom:5px}
.apprel-form-head .hint{display:block}
.apprel-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.apprel-form-grid .row{margin-bottom:9px}
.apprel-form-grid .row>label{flex:0 0 auto;min-width:92px}
.apprel-wide{grid-column:1/-1}
.apprel-input-row{display:flex;gap:7px;align-items:center;flex:1;min-width:0}
.apprel-input-row input{flex:1;min-width:0}
.apprel-field-hint{display:block;color:var(--dim2);font-size:11px;line-height:1.6;margin-top:2px}
.apprel-check{padding:2px 0 4px}
.apprel-check label{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:12.5px}
.apprel-check label span{color:var(--dim2);font-size:11px;font-weight:400}
.apprel-callout{padding:10px 12px;border-radius:10px;background:rgba(62,224,255,.055);border:1px solid rgba(62,224,255,.12);
  color:#a8c3d6;font-size:11.5px;line-height:1.7}
.apprel-form-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.apprel-list-card{padding-bottom:10px}
.apprel-list-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
.apprel-list-head h3{margin-bottom:4px}
.apprel-list-head .hint{display:block;max-width:560px;line-height:1.65}
.apprel-list{display:flex;flex-direction:column;gap:8px}
.apprel-row{display:grid;grid-template-columns:135px minmax(0,1fr) auto;gap:13px;align-items:center;
  padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.025)}
.apprel-row:hover{border-color:rgba(123,108,255,.22);background:rgba(255,255,255,.04)}
.apprel-row-pf{display:flex;align-items:center;gap:8px;min-width:0}
.apprel-row-pf b{display:block;font-size:12.5px;line-height:1.25}
.apprel-row-pf small{display:block;color:var(--dim2);font-size:10.5px}
.apprel-row-main{min-width:0}
.apprel-row-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.apprel-row-title strong{font-size:14px;letter-spacing:-.15px}
.apprel-build{font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.apprel-notes{margin-top:3px;color:var(--dim);font-size:11.5px;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.apprel-row-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:5px;color:var(--dim2);font-size:10.5px}
.apprel-link{max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apprel-row-actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}

.hero{display:none}
.navbtn{display:none}
.stat{position:relative;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;
      transition:transform .22s var(--ease),border-color .22s,background .22s}
.stat:hover{transform:translateY(-2px);border-color:rgba(62,224,255,.25);background:rgba(255,255,255,.05)}
.stat .sub{display:block;margin-top:2px;font-style:normal;font-size:10.5px;color:var(--dim2);letter-spacing:0}
.stat b{display:block;font-size:24px;line-height:1.2;margin:3px 0 2px;font-weight:680;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums;
        background:linear-gradient(120deg,#fff,#bcd2ff 60%,#9fe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--dim2);font-size:11.5px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim2);font-weight:500;font-size:11.5px;letter-spacing:.06em;white-space:nowrap}
td{word-break:break-all}
td:first-child{font-weight:500}
tbody tr,table tr{transition:background .18s}
tr:hover td{background:rgba(123,108,255,.07)}
.num{font-variant-numeric:tabular-nums}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:11.5px;white-space:nowrap;border:1px solid transparent}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9}
.t-ok{background:rgba(58,224,164,.12);color:var(--ok);border-color:rgba(58,224,164,.22)}
.t-warn{background:rgba(255,203,82,.12);color:var(--warn);border-color:rgba(255,203,82,.22)}
.t-bad{background:rgba(255,106,134,.12);color:var(--bad);border-color:rgba(255,106,134,.22)}
.t-dim{background:rgba(143,160,194,.12);color:var(--dim);border-color:rgba(143,160,194,.2)}
.t-acc{background:rgba(123,108,255,.16);color:#b9b0ff;border-color:rgba(123,108,255,.28)}

/* ---------- 按钮 ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;
     height:34px;padding:0 14px;margin:2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;
     background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--fg);
     transition:background .18s,border-color .18s,transform .12s var(--ease),box-shadow .18s}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(123,108,255,.45);transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,#7b6cff,#39c8ff);border-color:transparent;color:#fff;font-weight:600;
       box-shadow:0 8px 22px rgba(90,120,255,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.p:hover{filter:brightness(1.08);box-shadow:0 12px 28px rgba(90,120,255,.5)}
.btn.danger{color:var(--bad);border-color:rgba(255,106,134,.35)}
.btn.danger:hover{background:rgba(255,106,134,.12);border-color:rgba(255,106,134,.6)}
.btn.mini{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.rp{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);
    background:radial-gradient(circle,rgba(255,255,255,.38),rgba(255,255,255,0) 62%);
    animation:rp .62s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}

/* ---------- 表单 ---------- */
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);
  height:36px;padding:0 12px;border-radius:10px;font-size:13px;outline:none;
  transition:border-color .18s,box-shadow .18s,background .18s}
textarea{height:auto;padding:9px 12px;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--dim2)}
input:focus,select:focus,textarea:focus{border-color:rgba(123,108,255,.65);background:rgba(255,255,255,.07);
  box-shadow:0 0 0 3px rgba(123,108,255,.16)}
input[type=checkbox]{height:auto;width:16px;padding:0}
label{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.hide{display:none}
.empty{color:var(--dim2);text-align:center;padding:44px 0;font-size:13px}
.hint{font-size:12px;color:var(--dim2);line-height:1.7}
#af_look{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}

/* ---------- 管理项 ---------- */
.adm-item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
          transition:border-color .2s,transform .2s var(--ease)}
.adm-item:hover{border-color:rgba(123,108,255,.26);transform:translateY(-1px)}
.adm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.adm-head b{font-size:14px}
.adm-meta{color:var(--dim2);font-size:12px;margin-bottom:8px;line-height:1.9}
.adm-perms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.adm-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 移动端表格卡片 ---------- */
.tbl-cards{display:flex;flex-direction:column;gap:10px}
.tbl-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:0}
.tbl-card .tc-row{display:flex;gap:8px;padding:3px 0;font-size:13px;align-items:flex-start}
.tbl-card .tc-k{color:var(--dim2);font-size:11.5px;flex:0 0 62px;padding-top:3px}
.tbl-card .tc-v{flex:1;min-width:0;word-break:break-word}
.tbl-card .tc-title{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:6px;color:#eef3ff}
.tbl-card .tc-title:empty{display:none}
.tbl-card .tc-actions{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.tbl-card .tc-actions .btn{margin:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.reason{width:100%;resize:vertical;min-height:56px}
img.mini{width:44px;height:44px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:11px;background:rgba(123,108,255,.18);color:#c9c2ff;margin-left:4px}

/* ---------- 骨架屏 ---------- */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.11) 37%,rgba(255,255,255,.05) 63%);
    background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:10px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---------- Toast ---------- */
#toast{position:fixed;right:16px;bottom:16px;z-index:150;display:flex;flex-direction:column;gap:10px;
       width:min(368px,calc(100vw - 32px))}
.toast{position:relative;display:flex;gap:11px;padding:12px 14px 14px;border-radius:14px;overflow:hidden;
       background:rgba(15,21,35,.94);border:1px solid var(--line2);box-shadow:var(--shadow);backdrop-filter:blur(14px);
       animation:toastIn .4s var(--ease) both}
.toast.out{animation:toastOut .26s ease forwards}
.toast .ic{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;color:var(--ok);
           background:rgba(58,224,164,.14)}
.toast.err .ic{color:var(--bad);background:rgba(255,106,134,.15)}
.toast .tx{min-width:0}
.toast .tx b{display:block;font-size:13px;font-weight:600;line-height:1.5}
.toast .tx span{display:block;font-size:12px;color:var(--dim);line-height:1.55;word-break:break-word}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;transform-origin:left;
            background:linear-gradient(90deg,var(--acc),var(--acc2));animation:bar 2.6s linear forwards}
.toast.err .bar{background:linear-gradient(90deg,#ff6a86,#ffb36a)}
@keyframes toastIn{from{transform:translateX(26px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(20px) scale(.97);opacity:0}}
@keyframes bar{to{transform:scaleX(0)}}

/* ---------- 用户管理 ---------- */
.usr-scroll{overflow-x:auto;margin:0 -2px;padding:0 2px}
.usr-table th,.usr-table td{white-space:nowrap;vertical-align:middle}
.usr-av{position:relative;width:38px;height:38px;flex:0 0 38px;border-radius:50%;overflow:hidden;
        display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;
        background:linear-gradient(135deg,#7b6cff,#3ee0ff);border:1px solid var(--line2)}
.usr-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.usr-idcell{display:flex;align-items:center;gap:9px;min-width:160px}
.usr-idcell .nm{font-weight:600;line-height:1.25;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.usr-idcell .sub{font-size:10.5px;color:var(--dim2);margin-top:2px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.usr-bg{width:72px;height:38px;border-radius:7px;object-fit:cover;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.usr-hero{display:flex;gap:12px;align-items:center;padding:11px;border-radius:12px;
          border:1px solid var(--line);background:rgba(255,255,255,.025);margin-bottom:10px}
.usr-hero .usr-av{width:58px;height:58px;flex:0 0 58px;font-size:20px}
.usr-bgbox{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;
           border:1px solid var(--line);background:rgba(255,255,255,.02);margin-bottom:12px}
.usr-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.usr-edit-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);
                     min-width:0}
.usr-edit-grid input,.usr-edit-grid select{width:100%}
.usr-edit-grid .hint{font-size:10.5px;color:var(--dim2);line-height:1.5}
.usr-note{font-size:11.5px;color:var(--dim2);line-height:1.55;flex:1 1 100%;min-width:0;white-space:normal}
.usr-search{min-width:240px;flex:1 1 260px}
@media(max-width:560px){.usr-edit-grid{grid-template-columns:1fr}}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
      background:rgba(3,6,12,.66);backdrop-filter:blur(6px);animation:maskIn .25s ease both}
.dlg{width:min(540px,92vw);max-height:86vh;overflow:auto;padding:20px;border-radius:18px;
     background:linear-gradient(180deg,#0f1626,#0b1120);border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.6);
     animation:dlgIn .34s var(--ease) both}
.dlg h4{margin-bottom:12px;font-size:15px}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* ---------- 应用市场（内嵌社区后台） ---------- */
.appx-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.appx-search{position:relative;flex:1 1 240px;max-width:340px}
.appx-search .appx-search-ic{position:absolute;left:11px;top:10px;width:15px;height:15px;color:var(--dim2);stroke:currentColor;fill:none;pointer-events:none}
.appx-search input{padding-left:34px;width:100%}
.appx-seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.03)}
.appx-seg button{height:32px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--dim);padding:0 11px;font-size:11.5px}
.appx-seg button:last-child{border-right:0}
.appx-seg button.on{background:rgba(123,108,255,.2);color:#fff;box-shadow:inset 0 0 0 1px rgba(123,108,255,.35)}
.appx-appcell{display:flex;align-items:center;gap:10px;min-width:0}
.appx-icon{display:block;width:36px;height:36px;flex:0 0 36px;object-fit:cover;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.05)}
.appx-appname{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.appx-appsub{color:var(--dim2);font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.appx-actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.appx-actions .btn{margin:0}
.appx-kv{color:var(--dim2);font-size:11.5px;line-height:1.8}
.appx-kv b{color:var(--fg);font-weight:500}
.appx-addcat{display:grid;grid-template-columns:1.2fr 1fr 1fr 90px auto;gap:8px;align-items:end;margin-top:14px}
.appx-addcat select,.appx-addcat input{width:100%}
.appx-catrow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.appx-catrow:last-child{border-bottom:0}
.appx-catrow .grow{flex:1;min-width:0}
.appx-catname{font-weight:600}
.appx-catslug{font-size:10.5px;color:var(--dim2);margin-top:2px}
.appx-catchildren{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.appx-catchip{border:1px solid var(--line2);border-radius:999px;padding:1px 7px;font-size:10.5px;background:rgba(255,255,255,.04);color:var(--dim)}
.appx-catchip button{border:0;background:transparent;color:var(--dim2);padding:0 0 0 3px}
.appx-catchip button:hover{color:var(--bad)}
.appx-comment{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.appx-comment-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--dim2);font-size:11px}
.appx-comment-head b{color:var(--fg);font-size:12px}
.appx-comment-body{white-space:pre-wrap;word-break:break-word;line-height:1.7;margin-top:5px}
.appx-report{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.appx-report:last-child{border-bottom:0}
.appx-report .grow{flex:1;min-width:0}
.appx-report p{margin:3px 0 0;color:var(--dim);font-size:12px;white-space:pre-wrap;word-break:break-word}
.appx-detail-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr);gap:18px}
.appx-detail-main,.appx-detail-side{min-width:0}
.appx-detail-side{border-left:1px solid var(--line);padding-left:18px}
.appx-field{margin-bottom:14px}
.appx-field label{display:block;color:var(--dim2);font-size:10px;letter-spacing:.08em;margin-bottom:5px}
.appx-field .value{font-size:13px;line-height:1.7;word-break:break-word}
.appx-field .pre{white-space:pre-wrap}
.appx-shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.appx-shots img{width:100%;aspect-ratio:9/16;object-fit:cover;border:1px solid var(--line2);border-radius:7px;background:rgba(255,255,255,.04)}
.appx-source{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:8px;padding:8px 10px;font-size:11.5px;word-break:break-all;line-height:1.7}
.appx-source a{color:var(--acc2)}
.appx-review-note{width:100%;min-height:62px;margin:7px 0}
.appx-detail .dlg h4{max-width:calc(100% - 20px)}
.dlg.appx-detail{width:min(960px,94vw);max-height:91vh}
.dlg.appx-detail .dlg-close{position:absolute;right:14px;top:10px}
.appx-version-table th,.appx-version-table td{padding:7px 8px;font-size:11px}
.appx-empty{border:1px dashed var(--line2);border-radius:12px;text-align:center;color:var(--dim2);padding:38px 18px;font-size:12.5px}
@media(max-width:820px){
  .appx-addcat{grid-template-columns:1fr 1fr}
  .appx-addcat .btn{grid-column:span 2}
  .appx-detail-grid{grid-template-columns:1fr}
  .appx-detail-side{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:14px}
  .appx-shots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .appx-appname,.appx-appsub{max-width:180px}
}
@media(max-width:480px){.appx-shots{grid-template-columns:1fr}.appx-addcat{grid-template-columns:1fr}.appx-addcat .btn{grid-column:auto}}

/* ---------- 页面动效 ---------- */
#view.enter{animation:viewIn .38s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}


/* 全部功能：移动端抽屉 */
.mtitle{display:none}
.nsid{font-size:11.5px;color:var(--dim2);padding:0 4px 10px;letter-spacing:.2px}
.navsheet{position:fixed;inset:0;z-index:80;display:none;background:rgba(3,6,12,.6);
          backdrop-filter:blur(10px)}
.navsheet.on{display:block;animation:maskIn .22s ease both}
.navsheet.out{display:block;animation:maskOut .2s ease forwards}
.nscard{position:absolute;left:0;right:0;bottom:0;max-height:76vh;overflow:auto;
        background:linear-gradient(180deg,#0e1726,#070b12);border-top:1px solid rgba(255,255,255,.09);
        border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));
        box-shadow:0 -20px 60px rgba(0,0,0,.55)}
.navsheet.on .nscard{animation:sheetUp .34s cubic-bezier(.22,1,.36,1) both}
.navsheet.out .nscard{animation:sheetDown .22s ease forwards}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetDown{to{transform:translateY(26px);opacity:0}}
.nshead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.nshead b{font-size:14px;letter-spacing:.3px}
.nshead button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--dim);
               height:28px;padding:0 12px;border-radius:999px;font-size:12px;cursor:pointer}
.nsnav{display:flex;flex-direction:column;gap:2px}
.nsnav .grp{display:block;margin:10px 4px 6px}
.nsnav a{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:12px;
         color:#cdd7ea;text-decoration:none;font-size:14px;transition:background .18s,color .18s}
.nsnav a::before{content:"";width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);margin-right:10px}
.nsnav a:active{background:rgba(255,255,255,.07)}
.nsnav a.on{color:#fff;background:linear-gradient(135deg,rgba(123,108,255,.26),rgba(62,224,255,.14));
            box-shadow:inset 0 0 0 1px rgba(123,108,255,.32)}

/* ---------- 登录 ---------- */
body.nologin .side{display:none}
body.nologin .top{display:none}
body.nologin .main{max-width:none;padding:0 24px}
.login-wrap{min-height:calc(100vh - 160px);display:grid;place-items:center}
.login-card{width:min(430px,92vw);padding:30px 26px 26px;border-radius:22px;
    background:linear-gradient(180deg,rgba(20,28,46,.92),rgba(10,15,26,.94));border:1px solid var(--line2);
    box-shadow:0 30px 80px rgba(0,0,0,.6);animation:cardIn .5s var(--ease) both}
.login-card .lg{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-card .lg .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#fff;font-weight:600;
    background:linear-gradient(135deg,#7b6cff,#3ee0ff);box-shadow:0 10px 30px rgba(110,110,255,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.login-card .lg b{font-size:17px}
.login-card .lg small{display:block;color:var(--dim2);font-size:12px}
.login-card h3{font-size:14px;margin-bottom:12px;color:#fff}
.login-card .row{margin-bottom:16px}
.login-card input{flex:1;min-width:0}
.login-card .btn{width:100%;height:40px;font-size:14px}

  .card{padding:15px;border-radius:16px}

  .card h3{font-size:14.5px;margin-bottom:12px;line-height:1.4}
  .hero{display:none}
  .stat, .card{box-shadow:0 10px 26px rgba(0,0,0,.22)}
  /* —— 仪表盘 hero —— */
  .hero{display:block;position:relative;overflow:hidden;margin-bottom:12px;padding:17px 16px 15px;
        border-radius:18px;border:1px solid rgba(123,108,255,.22);

  .hero::after{content:"";position:absolute;right:-40px;top:-56px;width:150px;height:150px;border-radius:50%;

  /* —— 表格转卡片 —— */
  .card.plain-card{background:none;border:0;box-shadow:none;padding:0}

  .tbl-card .tc-title{font-size:15px;margin-bottom:8px}

                        justify-content:flex-end}
  .tbl-card .tc-actions .btn,.tbl-card .tc-actions .mini{height:38px;min-width:74px;max-width:48%;
                        flex:1 1 auto;padding:0 10px;font-size:12.5px;border-radius:11px}

  /* —— 表单：竖向大控件 —— */

  .btn.mini{height:34px;padding:0 12px;font-size:12px;flex:0 0 auto;width:auto}
  /* —— 反馈 —— */
  #toast{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto}

           background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}

  .nsnav a.on{background:linear-gradient(135deg,rgba(123,108,255,.3),rgba(62,224,255,.16));
              border-color:rgba(123,108,255,.4)}

  /* —— 客户端版本 —— */

<body>
<div id="prog"></div>
<div class="wrap">
  <aside class="side">
    <div class="logo">
      <div class="ic">萤</div>
      <div class="lt"><b>流萤社区</b><small>管理后台 · v1</small></div>
      <div class="mtitle" id="mtitle">仪表盘</div>
      <button class="navbtn" id="navbtn" aria-label="全部功能">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">流萤 · 社区运营中心</div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="tl"><h1 id="ttl"></h1><div class="sub" id="sub"></div></div>
      <div class="who" id="who"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="navsheet" id="navsheet" aria-hidden="true">
  <div class="nscard" role="dialog" aria-label="全部功能">
    <div class="nshead"><b>全部功能</b><button id="nsclose">收起</button></div>
    <div class="nsid" id="nsid"></div>
    <nav class="nsnav" id="nsnav"></nav>
  </div>
</div>
<div id="toast"></div>
<div id="dlgBox"></div>

<script>
const API = "/community/api";
// 迁移旧版 localStorage 里的长期 token：只保留当前浏览器会话。
localStorage.removeItem("liuying_comm_admin");
let TOK = sessionStorage.getItem("liuying_comm_admin") || "";
let LVL = 0;
// 当前身份：{role, perms, name}；菜单与操作按模块权限渲染
let ME = {role:"", perms:[], name:""};
const ROLE_LABEL = {super:"超级管理员", admin:"管理员", auditor:"审核员"};
const NAV_MODULE = {dash:"data", audit:"content", posts:"content", comments:"comments",
  reports:"content", feedback:"feedback", boards:"ops", topics:"ops", banners:"ops",
  activities:"ops", words:"ops", userlist:"users", members:"users", invites:"users", official:"ops",
  afwork:"users", afusers:"users", afcodes:"users",
  afoverview:"users", afconvs:"users", afset:"system",
  aibot:"users", aibotHome:"users", aibotLog:"users", site:"ops", appRelease:"ops",
  hotUpdate:"ops",
  frames:"ops", emojis:"ops", admins:"admins", system:"system",
  appsDash:"apps", appsList:"apps", appsCats:"apps", appComments:"apps", appReports:"apps"};
function identityText(){
  const role = ROLE_LABEL[ME.role] || "管理员";
  const name = (ME.name||"").trim();
  if(!name || name === role || name === "超级管理员" && ME.role === "super") return "当前身份：" + role;
  return "当前身份：" + role + " · " + name;
}
function can(module){ return ME.role === "super" || (ME.perms||[]).includes(module); }

const NAV = [
  ["仪表盘", "dash", 1],["帖子审核", "audit", 2],["帖子管理", "posts", 2],
  ["评论管理", "comments", 2],["举报处理", "reports", 2],["反馈处理", "feedback", 2],
  ["运营", "ops", 0],
  ["版块管理", "boards", 1],["话题管理", "topics", 1],["Banner", "banners", 1],
  ["活动管理", "activities", 1],["敏感词", "words", 1],["官网内容", "site", 1],["热更新", "hotUpdate", 1],["版本更新", "appRelease", 1],
  ["用户", "users", 0],
  ["用户管理", "users", 1],["会员管理", "members", 1],["邀请返现", "invites", 1],
  ["AI 工坊", "afwork", 0],
  ["工坊用户", "afusers", 1],["工坊兑换码", "afcodes", 1],
  ["AI 概览", "afoverview", 1],["AI 会话", "afconvs", 1],["AI 设置", "afset", 1],
  ["AI 社区", "aibot", 0],
  ["小萤发布", "aibotHome", 1],["发布记录", "aibotLog", 1],

  ["内容工具", "tools", 0],
  ["官方通知", "official", 1],["头像框", "frames", 1],["表情包", "emojis", 1],
  ["系统", "sys", 0],
  ["管理员", "admins", 1],["令牌/日志", "system", 1],["支付设置", "payset", 1],
  ["应用市场", "apps", 0],
  ["应用概览", "appsDash", 1],["应用审核", "appsList", 1],["分类管理", "appsCats", 1],
  ["应用评论", "appComments", 1],["应用举报", "appReports", 1],
];

function $(s, p){ return (p||document).querySelector(s); }
function $$(s, p){ return Array.from((p||document).querySelectorAll(s)); }

const _ICON_OK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const _ICON_X  = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

function toast(msg, err, desc){
  const box = $("#toast");
  if(!box) return;
  while(box.children.length >= 3) box.firstElementChild.remove();
  const d = document.createElement("div");
  d.className = "toast" + (err ? " err" : "");
  d.innerHTML = `<div class="ic">${err ? _ICON_X : _ICON_OK}</div>
    <div class="tx"><b>${err ? "操作失败" : "操作成功"}</b><span>${esc(msg)}</span>${desc?`<span>${esc(desc)}</span>`:""}</div>
    <div class="bar"></div>`;
  box.appendChild(d);
  setTimeout(()=>{ d.classList.add("out"); setTimeout(()=>d.remove(), 300); }, err ? 3400 : 2600);
}

/* 顶部进度条：所有 API 请求期间显示 */
let _busy = 0;
function progStart(){
  _busy++;
  const p = $("#prog");
  if(!p) return;
  p.style.opacity = "1";
  p.style.width = "62%";
  setTimeout(()=>{ if(_busy) p.style.width = "86%"; }, 500);
}
function progEnd(){
  _busy = Math.max(0, _busy - 1);
  if(_busy) return;
  const p = $("#prog");
  if(!p) return;
  p.style.width = "100%";
  setTimeout(()=>{ p.style.opacity = "0"; p.style.width = "0"; }, 280);
}

async function api(method, path, body){
  const h = {"Content-Type":"application/json"};
  if(TOK) h["X-Community-Admin-Token"] = TOK;
  const opt = {method, headers:h};
  if(body !== undefined) opt.body = JSON.stringify(body);
  progStart();
  let r;
  try{
    r = await fetch(API + path, opt);
  }finally{
    progEnd();
  }
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(r.status === 401 || r.status === 403){
    if(r.status === 401){ toast("令牌失效，请重新登录", 1); showLogin(); }
    throw new Error(j.error || "无权限");
  }
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
const q = (k,v)=>encodeURIComponent(k)+"="+encodeURIComponent(v);

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function fmt(t){
  if(!t) return "-";
  const d = new Date(t*1000);
  return d.toLocaleString("zh-CN",{hour12:false});
}
function auditTag(s){
  return s===0?'<span class="tag t-warn">待审</span>':s===1?'<span class="tag t-ok">已通过</span>':s===2?'<span class="tag t-bad">已拒绝</span>':'<span class="tag t-dim">'+s+'</span>';
}
function typeTag(t){
  return t==="video"?'<span class="tag t-acc">视频</span>':t==="poll"?'<span class="tag t-warn">投票</span>':'<span class="tag t-dim">图文</span>';
}
function short(s, n){
  s = String(s||""); return s.length>(n||40)?s.slice(0,(n||40))+"…":s;
}

/* ---------------- 登录 ---------------- */
function showLogin(){
  TOK = ""; sessionStorage.removeItem("liuying_comm_admin"); localStorage.removeItem("liuying_comm_admin");
  document.body.classList.add("nologin");
  $("#view").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="lg"><div class="ic">萤</div><div><b>流萤社区</b><small>管理后台 · 运营中心</small></div></div>
        <h3>管理员登录</h3>
        <div class="row"><input id="tk" style="flex:1" placeholder="粘贴管理令牌"></div>
        <button class="btn p" onclick="login()">进入后台</button>
      </div>
    </div>`;
  $("#ttl").textContent = "登录";
  $("#who").textContent = "";
}
async function login(){
  const tk = $("#tk").value.trim();
  if(!tk) return toast("请输入令牌",1);
  TOK = tk;
  try{
    await loadMe();
    sessionStorage.setItem("liuying_comm_admin", TOK);
    document.body.classList.remove("nologin");
    toast("登录成功 · " + (ROLE_LABEL[ME.role] || "管理员"));
    renderNav(); go(hashedView() || defaultView());
  }catch(e){ toast(e.message,1); }
}

/* ---------------- 导航 / 路由 ---------------- */
async function loadMe(){
  try{
    const j = await api("GET", "/admin/me");
    ME = {role: j.role || "auditor", perms: j.perms || [], name: j.name || ""};
  }catch(e){
    ME = {role:"", perms:[], name:""};
  }
}

function renderNav(){
  const groups = [];
  NAV.forEach(([t,id,lvl])=>{
    if(lvl>0 && LVL>0 && lvl<LVL) return; // 二级(lvl=2)要求 level≥2；level=1 全可见
    const g = groups.find(x=>x.t===t);
    if(t==="用户"&&id==="users" && groups.find(x=>x.t==="用户")) return;
    // 分组
  });
  let html = "";
  let cur = "";
  NAV.forEach(([t,id,lvl])=>{
    if(lvl>0 && LVL===0 && id!=="dash") return;
    if(t==="用户" && id==="users") return;
    if(t==="仪表盘" && cur==="") cur="dash";
  });
  const item=(v,txt,mod)=>can(mod)?`<a data-v="${v}" href="javascript:void 0">${txt}</a>`:"";
  html = can("data")?`<div class="grp">总览</div>${item("dash","仪表盘","data")}`:"";
  if(can("users")||can("system")){
    html += `<div class="grp">AI 社区</div>`
      + item("aibotHome","小萤发布","users")
      + item("aibotLog","发布记录","users");
  }
  if(can("content")||can("comments")||can("feedback")){
    html += `<div class="grp">内容治理</div>`
      + item("audit","帖子审核","content") + item("posts","帖子管理","content")
      + item("comments","评论管理","comments") + item("reports","举报处理","content")
      + item("feedback","反馈处理","feedback");
  }
  if(can("apps")){
    html += `<div class="grp">应用市场</div>`
      + item("appsDash","应用概览","apps")
      + item("appsList","应用审核","apps")
      + item("appsCats","分类管理","apps")
      + item("appComments","应用评论","apps")
      + item("appReports","应用举报","apps");
  }
  if(can("ops")){
    html += `<div class="grp">运营配置</div>`
      + item("boards","版块管理","ops") + item("topics","话题管理","ops")
      + item("banners","Banner","ops") + item("activities","活动管理","ops")
      + item("words","敏感词","ops") + item("site","官网内容","ops")
      + item("hotUpdate","热更新","ops") + item("appRelease","版本更新","ops");
  }
  if(can("users")){
    html += `<div class="grp">用户与会员</div>`
      + item("userlist","用户管理","users") + item("members","会员管理","users")
      + (ME.role==="super" ? item("invites","邀请返现","users") : "");
  }
  if(can("users")||can("system")){
    html += `<div class="grp">AI 工坊</div>`
      + item("afoverview","AI 概览","users")
      + item("afusers","工坊用户","users")
      + item("afcodes","工坊兑换码","users")
      + item("afconvs","AI 会话","users")
      + item("afset","AI 设置","system");
  }
  if(can("ops")){
    html += `<div class="grp">内容工具</div>`
      + item("official","官方通知","ops") + item("frames","头像框","ops")
      + item("emojis","表情包","ops");
  }
  if(can("admins")||can("system")){
    html += `<div class="grp">系统</div>`
      + item("admins","管理员","admins") + item("system","令牌/日志/等级","system")
      + item("payset","支付设置","system");
  }
  $("#nav").innerHTML = html;
  $$("#nav a[data-v]").forEach(a=>a.onclick=()=>go(a.dataset.v));
}
let CURV = "dash";
const GROUP_OF = (function(){
  const m = {}; let g = "";
  NAV.forEach(([t,id,lvl])=>{ if(lvl===0){ g = t; } else if(id && !m[id]){ m[id] = g; } });
  return m;
})();

function hashedView(){
  return {"#apps":"appsDash","#appsList":"appsList","#appsCats":"appsCats",
    "#appComments":"appComments","#appReports":"appReports","#site":"site",
    "#hot":"hotUpdate", "#release":"appRelease"}[location.hash] || "";
}

function skeletonHTML(){
  const line = (w,h)=>`<div class="sk" style="height:${h}px;width:${w};margin-bottom:10px"></div>`;
  return `<div class="card">${line("130px", 15)}${line("72%", 12)}${line("55%", 12)}</div>
    <div class="card">${line("100%", 46)}${line("100%", 46)}${line("100%", 46)}</div>`;
}

function syncTitle(){
  const m = $("#mtitle"), t = $("#ttl");
  if(m) m.textContent = (t && t.textContent.trim()) || "运营后台";
}

function animateIn(){
  const v = $("#view");
  if(!v) return;
  v.classList.remove("enter");
  void v.offsetWidth;
  v.classList.add("enter");
  $$("#view .card").forEach((c,i)=>{ if(i>8) return;
    c.style.animation = "cardIn .42s cubic-bezier(.2,.9,.25,1) both";
    c.style.animationDelay = (i*38) + "ms"; });
  $$("#view table tr").forEach((tr,i)=>{ if(i>26) return;
    tr.style.animation = "rowIn .32s cubic-bezier(.2,.9,.25,1) both";
    tr.style.animationDelay = (i*22) + "ms"; });
}

function go(v){
  CURV = v;
  $$("#nav a").forEach(a=>a.classList.toggle("on", a.dataset.v===v));
  const sb = $("#sub");
  if(sb) sb.textContent = GROUP_OF[v] ? ("运营后台 · " + GROUP_OF[v]) : "运营后台";
  $("#view").innerHTML = skeletonHTML();
  const map = {dash:viewDash, audit:viewAudit, posts:viewPosts, comments:viewComments,
    reports:viewReports, feedback:viewFeedback, boards:viewBoards, topics:viewTopics, banners:viewBanners,

document.addEventListener("pointerdown", function(e){
  const b = e.target.closest(".btn, #nav a");
  if(!b) return;
  const r = b.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2;
  const el = document.createElement("span");
  el.className = "rp";
  el.style.width = el.style.height = d + "px";
  el.style.left = (e.clientX - r.left - d/2) + "px";
  el.style.top = (e.clientY - r.top - d/2) + "px";
  b.appendChild(el);
  setTimeout(()=>el.remove(), 640);
});

/* 窄屏下把数据表格转成「字段名：值」的卡片，避免横向拖动才能看到操作按钮 */
function responsiveTables(){
  if(window.innerWidth > 820) return;
  $$("#view table").forEach(t=>{
    const heads = $$("th", t).map(th=>th.textContent.trim());
    const rows = $$("tr", t).filter(tr=>tr.querySelectorAll("td").length);
    if(!rows.length) return;
    const box = document.createElement("div");
    box.className = "tbl-cards";
    let actIdx = heads.findIndex(h=>h === "操作");
    rows.forEach(tr=>{
      const tds = $$("td", tr);
      // 首列若是纯状态胶囊（如帖子状态），改用最长的文本列做标题
      let titleIdx = 0;
      const t0 = tds[0];
      if(t0 && t0.querySelector(".tag") && t0.textContent.trim().length <= 8){
        const idx = tds.findIndex((t,i)=> i>0 && t.textContent.trim().length >= 10);
        if(idx > 0) titleIdx = idx;
      }
      // 没有「操作」表头时，若最后一列含按钮也当作操作区
      if(actIdx < 0 && tds.length && /<button/i.test(tds[tds.length-1].innerHTML)) actIdx = tds.length-1;
      const card = document.createElement("div");
      card.className = "tbl-card";
      let inner = "";
      let titleHtml = "";
      tds.forEach((td,i)=>{
        if(i === actIdx) return;
        const key = heads[i] || "";
        const val = td.innerHTML.trim() || "-";
        if(i !== 0 && !td.querySelector("button, input, select, textarea, img") &&
           /^(-|—|·|暂无|空)?$/i.test(td.textContent.replace(/\s+/g,""))) return;
        if(i===titleIdx && key && !/^操作$/.test(key)){
          const lead = (titleIdx !== 0 && tds[0]) ? tds[0].innerHTML + " " : "";
          titleHtml = `<div class="tc-title">${lead}${val}</div>`;
        } else if(i===0 && titleIdx!==0){
          return;
        } else if(td.textContent.trim().length > 26){
          inner += `<div class="tc-block"><span class="tc-k">${esc(key)}</span><div class="tc-v">${val}</div></div>`;
        } else {
          inner += key
            ? `<div class="tc-row"><span class="tc-k">${esc(key)}</span><div class="tc-v">${val}</div></div>`
            : `<div class="tc-row"><div class="tc-v">${val}</div></div>`;
        }
      });
      const actTd = actIdx >= 0 ? tds[actIdx] : null;
      const acts = actTd && actTd.innerHTML.trim() && actTd.textContent.trim() !== "-"
        ? `<div class="tc-actions">${actTd.innerHTML}</div>` : "";
      card.innerHTML = titleHtml + inner + acts;
      box.appendChild(card);
    });
    t.replaceWith(box);
    const host = box.closest && box.closest(".card");
    if(host) host.classList.add("plain-card");
  });
}

const AIB_LABEL = {post:"帖子", video:"短视频", app:"应用"};
function aiStatusTag(st){
  const m = {done:"t-ok", pending_review:"t-warn", skipped:"t-dim", failed:"t-bad",
             rejected:"t-bad", scheduled:"t-acc"};
  return `<span class="tag ${m[st]||"t-dim"}">${esc(st||"—")}</span>`;
}
function aiNextText(ts){
  return ts ? fmt(ts) : "待 AI 排期";
}
function aiResultText(x){
  let r = String(x.result || "");
  if (r.indexOf("{'ok': True")>=0 || r.indexOf('{"ok": true')>=0) return "完成";
  if (r.indexOf("{'ok': False")>=0 || r.indexOf('{"ok": false')>=0) {
    const m = r.match(/['"]reason['"]:\s*['"]([^'"]+)['"]/);
    return m ? "失败：" + m[1] : "失败";
  }
  return r;
}
function aiLastText(x){
  if(!x) return "等待第一次执行";
  if(/^成功[:：]/.test(x)) return "已提交审核";
  if(x.indexOf("首次自主排期")>=0) return "等待首次执行";
  if(/^失败|^跳过/.test(x)) return x;
  return x;
}

function relDate(ts){
  if(!ts) return "未发布";
  try{ return new Date(Number(ts)*1000).toLocaleString("zh-CN",{hour12:false}); }catch(e){ return ""; }
}
function relLatest(p){ return (REL.latest||{})[p] || null; }
function relFullUrl(url){
  const u = String(url||"").trim();
  if(!u) return "";
  try{ return new URL(u, location.origin).href; }catch(e){ return u; }
}
function relShortUrl(url){
  const u = String(url||"").trim();
  if(!u) return "未填写下载地址";
  if(u.indexOf("community/api/media/") >= 0) return "站内安装包 · " + u.split("/").pop();
  try{ const x=new URL(u, location.origin); return x.host + (x.pathname.length>1 ? x.pathname : ""); }catch(e){ return u; }
}
function relPayload(it){
  return {
    id: it.id || "",
    platform: it.platform || "android",
    version: it.version || "",
    build: Number(it.build || 0),
    downloadUrl: it.downloadUrl || "",
    packageSize: it.packageSize || "",
    notes: it.notes || "",
    force: !!it.force,
    status: Number(it.status) === 1 ? 1 : 0,
    channel: it.channel || "stable",
    rollout: Number(it.rollout == null ? 100 : it.rollout)
  };
}

async function viewAppRelease(){
  $("#ttl").textContent = "版本更新";
  $("#sub").textContent = "客户端 · Android / iOS 发版、安装包与强制更新";
  try{ const j = await api("GET", "/admin/app-releases"); REL = {items:j.items||[], latest:j.latest||{}, platforms:j.platforms||["android","ios"]}; }
  catch(e){ return err(e); }
  renderAppRelease();
}
function openRelForm(id, platform){
  if(id){
    const it = (REL.items||[]).find(x=>x.id===id);
    if(!it) return toast("发布记录不存在，请刷新",1);
    REL_EDIT = {...it};
  }else{
    const p = platform || "android";
    const l = relLatest(p);
    REL_EDIT = {platform:p, version:"", build:l?Number(l.build)+1:"", downloadUrl:"", packageSize:"", notes:"", force:false, status:1, channel:"stable", rollout:100};
  }
  renderAppRelease();
  setTimeout(()=>{ const f=$("#apprelForm"); if(f) f.scrollIntoView({behavior:"smooth",block:"start"}); }, 60);
}
function closeRelForm(){ REL_EDIT = null; renderAppRelease(); }
function syncRelForm(){
  if(!REL_EDIT) return;
  const val = id=>{ const el=$(id); return el ? el.value : ""; };
  REL_EDIT.platform = val("#relPlatform") || REL_EDIT.platform;
  REL_EDIT.version = val("#relVersion").trim();
  REL_EDIT.build = Number(val("#relBuild") || 0);
  REL_EDIT.status = Number(val("#relStatus") || 0) === 1 ? 1 : 0;
  REL_EDIT.channel = val("#relChannel") || "stable";
  REL_EDIT.rollout = Number(val("#relRollout") || 100);
  REL_EDIT.downloadUrl = val("#relDownloadUrl").trim();
  REL_EDIT.packageSize = val("#relPackageSize").trim();
  REL_EDIT.notes = val("#relNotes").trim();
  const f = $("#relForce"); REL_EDIT.force = !!(f && f.checked);
}
async function saveAppRelease(){
  if(!REL_EDIT) return;
  syncRelForm();
  const body = relPayload(REL_EDIT);
  if(!body.version) return toast("请填写版本号",1);
  if(body.build < 0) return toast("Build 号不能为负数",1);
  if(body.status===1 && !body.downloadUrl) return toast("上线前请先上传安装包或填写下载地址",1);
  try{
    await api("POST", "/admin/app-releases", body);
    toast("版本已保存");
    REL_EDIT = null;
    await viewAppRelease();
  }catch(e){ toast(e.message,1); }
}
async function toggleAppRelease(id){
  const it = (REL.items||[]).find(x=>x.id===id);
  if(!it) return;
  const next = relPayload(it);
  next.status = it.status===1 ? 0 : 1;
  if(next.status===1 && !next.downloadUrl) return toast("这个版本没有下载地址，补上后才能上线",1);
  if(next.status===0 && !confirm("下线后 APP 将不再收到这个版本，确定吗？")) return;
  try{
    await api("POST", "/admin/app-releases", next);
    toast(next.status===1?"已上线":"已下线");
    await viewAppRelease();
  }catch(e){ toast(e.message,1); }
}
async function deleteAppRelease(id){
  const it = (REL.items||[]).find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`删除 v${it.version} build ${it.build} 的发布记录？此操作不可恢复。`)) return;
  try{
    await api("DELETE", "/admin/app-releases/"+encodeURIComponent(id));
    toast("发布记录已删除");
    await viewAppRelease();
  }catch(e){ toast(e.message,1); }
}
async function copyRelUrl(id){
  const it = (REL.items||[]).find(x=>x.id===id);
  if(!it || !it.downloadUrl) return toast("这个版本还没有下载地址",1);
  const text = relFullUrl(it.downloadUrl);
  try{
    await navigator.clipboard.writeText(text);
    toast("下载地址已复制");
  }catch(e){
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("下载地址已复制");
  }
}
function uploadRelPackage(){
  if(!REL_EDIT || REL_UPLOADING) return;
  syncRelForm();
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".apk,.ipa";
  inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 128*1024*1024) return toast("安装包不能超过 128MB（网关上限 160MB）",1);
    REL_UPLOADING = true; renderAppRelease();
    const fd = new FormData(); fd.append("file", f);
    try{
      if(window.progStart) progStart();
      const r = await fetch(API+"/admin/upload-package", {method:"POST", headers:{"X-Community-Admin-Token":TOK}, body:fd});
      let j={}; try{ j=await r.json(); }catch(e){}
      if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
      REL_EDIT = {...REL_EDIT, downloadUrl:j.url||"", packageSize:j.sizeText||REL_EDIT.packageSize||""};
      toast("安装包已上传");
    }catch(e){ toast(e.message||"上传失败",1); }
    finally{
      if(window.progEnd) progEnd();
      REL_UPLOADING = false; renderAppRelease();
    }
  };
  inp.click();
}

const HOT_ACTION = {save:"保存", publish:"上线", disable:"停用", delete:"删除", rollback:"回滚", master_on:"开启总开关", master_off:"关闭总开关"};

function hotDefaultValue(key){
  if(key==="maintenance") return {enabled:true,title:"流萤社区维护中",message:"我们正在升级服务，请稍后再回来。",eta:""};
  if(key==="home_announcement") return {enabled:true,id:"",badge:"公告",title:"",body:"",actionText:"",actionUrl:"",dismissible:true};
  if(key==="feature_flags") return {shorts:true,apps:true,post:true,comments:true,dm:true,inline_text_emoji:false};
  if(key==="app_copy") return {};
  return {};
}
function hotSummary(it){
  const v = it.value;
  if(it.key==="maintenance") return v && v.enabled ? ("维护开启 · "+(v.title||"未填标题")) : "维护关闭";
  if(it.key==="home_announcement") return v && v.enabled ? ("公告 · "+(v.title||"未填标题")) : "公告关闭";
  if(it.key==="feature_flags" && v && typeof v==="object"){
    const on = Object.keys(v).filter(k=>v[k]); return on.length ? ("开启 " + on.slice(0,5).join(" / ") + (on.length>5?" …":"")) : "全部关闭";
  }
  try{ const t=JSON.stringify(v); return t && t!=="{}" ? t : "空配置"; }catch(e){ return "—"; }
}
function hotValueTypeOf(key){
  if(key==="maintenance"||key==="home_announcement"||key==="feature_flags"||key==="app_copy") return "json";
  return "json";
}
function hotFiltered(){
  return (HOT.items||[]).filter(it=>{
    if(HOT_FILTER.platform!=="all" && it.platform!==HOT_FILTER.platform) return false;
    if(HOT_FILTER.status==="active" && it.status!==1) return false;
    if(HOT_FILTER.status==="draft" && it.status===1) return false;
    if(HOT_FILTER.q){
      const q=HOT_FILTER.q.toLowerCase();
      return (it.key+" "+(it.description||"")+" "+JSON.stringify(it.value||"")).toLowerCase().includes(q);
    }
    return true;
  });
}
function hotSetFilter(k,v){ HOT_FILTER[k]=v; renderHotUpdate(); }
function hotStatusTag(it){ return it.status===1?'<span class="tag t-ok">已生效</span>':'<span class="tag t-dim">未生效</span>'; }
function hotRow(it){
  const p = it.platform==="all" ? '<span class="tag t-acc">双端</span>' : `<span class="tag ${it.platform==="ios"?"t-acc":"t-ok"}">${HOT_PF[it.platform]||it.platform}</span>`;
  const ch = it.channel==="all" ? "全渠道" : (it.channel==="stable"?"正式":it.channel);
  const roll = Number(it.rollout)===100 ? "全量" : ("灰度 "+it.rollout+"%");
  return `<div class="hot-row">
    <div class="hot-row-key"><code>${esc(it.key)}</code>
      <span class="tag t-dim">${HOT_CAT[it.category]||it.category}</span>${p}${hotStatusTag(it)}
    </div>
    <div class="hot-row-main">
      <p title="${esc(hotSummary(it))}">${esc(it.description||hotSummary(it))}</p>
      <div class="hot-row-meta"><span>${esc(hotSummary(it))}</span><span>${esc(ch)} · ${roll}</span>
        ${it.min_build?`<span>build ≥ ${it.min_build}</span>`:""}${it.max_build?`<span>build ≤ ${it.max_build}</span>`:""}
        <span>rev ${it.revision||0}</span></div>
    </div>
    <div class="hot-row-actions">
      <button class="btn mini" onclick="openHotForm('${esc(it.key)}','${esc(it.id)}')">编辑</button>
      <button class="btn mini" onclick="toggleHotConfig('${esc(it.id)}')">${it.status===1?"停用":"启用"}</button>
      <button class="btn mini" onclick="showHotHistory('${esc(it.id)}')">历史</button>
      <button class="btn mini danger" onclick="deleteHotConfig('${esc(it.id)}')">删除</button>
    </div>
  </div>`;
}
function hotQuick(label, sub, icon, key, id){
  return `<button type="button" onclick="openHotForm('${key}','${id||""}')"><span class="ico">${icon}</span><b>${label}</b><span>${sub}</span></button>`;
}

}

    <div class="row"><label>平台</label><select id="hyPlatform">${(HOT.platforms||[]).map(p=>`<option value="${p}" ${it.platform===p?"selected":""}>${HOT_PF[p]||p}</option>`).join("")}</select></div>

    <div class="row"><label>最低 build</label><input id="hyMinBuild" type="number" min="0" value="${esc(it.min_build||0)}"></div>

  </div>`;

function hotLocalTime(ts){
  const n=Number(ts||0); if(!n) return "";
  const d=new Date(n*1000);
  const p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}

      <div class="hot-form-grid">
        <div class="row"><label>标题</label><input id="hyMaintTitle" value="${esc(v.title||"")}" placeholder="流萤社区维护中"></div>

        <div class="row apprel-wide"><label>说明</label><textarea id="hyMaintMessage" rows="4" placeholder="告诉用户发生了什么、什么时候回来">${esc(v.message||"")}</textarea></div>

      <div class="hot-form-grid">
        <div class="row"><label>角标</label><input id="hyAnnBadge" value="${esc(v.badge||"")}" placeholder="公告 / 活动"></div>
        <div class="row"><label>公告 ID</label><input id="hyAnnId" value="${esc(v.id||"")}" placeholder="留空自动生成，用于记住用户关闭"><span class="apprel-field-hint">换 ID 会让关过的用户重新看到。</span></div>
        <div class="row apprel-wide"><label>标题</label><input id="hyAnnTitle" value="${esc(v.title||"")}" placeholder="一句话说清楚"></div>
        <div class="row apprel-wide"><label>正文</label><textarea id="hyAnnBody" rows="3" placeholder="最多 600 字">${esc(v.body||"")}</textarea></div>
        <div class="row"><label>按钮文案</label><input id="hyAnnActionText" value="${esc(v.actionText||"")}" placeholder="去看看"></div>

      </div>
      <div class="hot-check"><input type="checkbox" id="hyAnnDismiss" ${v.dismissible!==false?"checked":""}><label for="hyAnnDismiss">允许用户关闭 <span>关闭后按公告 ID 记住，不再出现。</span></label></div>

    return `<div class="hot-sec"><h4>功能开关</h4>
      <div class="hot-flags">${keys.map(k=>{
        const def = k==="inline_text_emoji" ? false : true;
        const on = v[k]===undefined ? def : v[k]===true;
        return `<div class="hot-check"><input type="checkbox" id="hyFlag_${k}" ${on?"checked":""}><label for="hyFlag_${k}">${labels[k]} <span>${on?"开启":"关闭"}</span></label></div>`;
      }).join("")}</div>
      <span class="apprel-field-hint">「文字表情混排」关闭后，流萤表情按普通图片表情发送；历史内容里的 [表情名] 仍会正常渲染。只控制客户端入口，不删数据。</span>

function hotFormView(it){
  const isNew=!it.id;
  return `<div class="card hot-form" id="hotForm">
    <div class="apprel-form-head"><div><h3>${isNew?"新建热更新配置":"编辑热更新配置"}</h3>

      <button class="btn mini" type="button" onclick="closeHotForm()">收起</button></div>
    ${hotGeneralFields(it)}
    ${hotValueEditor(it)}
    <div class="apprel-callout">热更新 = 配置、文案、开关、公告和版本策略的远程下发，不替换已签名安装包里的 Dart 代码。真正改代码仍需发 APK / IPA。</div>
    <div class="apprel-form-actions">
      <button class="btn p" type="button" onclick="saveHotConfig()">${isNew?"保存并生效":"保存修改"}</button>
      <button class="btn" type="button" onclick="closeHotForm()">取消</button>
    </div>
  </div>`;

function hotEditorFor(key,id){
  if(id){
    const it=(HOT.items||[]).find(x=>x.id===id);
    if(!it) return null;
    return {...it, value: JSON.parse(JSON.stringify(it.value==null?{}:it.value))};
  }
  const existing=(HOT.items||[]).find(x=>x.key===key && x.platform==="all" && x.channel==="stable");
  if(existing) return {...existing, value: JSON.parse(JSON.stringify(existing.value==null?{}:existing.value))};
  return {key:key||"",category:key==="maintenance"?"maintenance":(key==="home_announcement"?"notice":(key==="feature_flags"?"flag":"config")),
    platform:"all",channel:"stable",valueType:hotValueTypeOf(key||"config"),value:hotDefaultValue(key),
    description:"",status:1,priority:key==="maintenance"?50:0,min_build:0,max_build:0,rollout:100,
    starts_at:0,ends_at:0,revision:0};
}
function openHotForm(key,id){
  HOT_EDIT=hotEditorFor(key||"",id||"");
  if(!HOT_EDIT){ toast("配置不存在，请刷新",1); return; }
  renderHotUpdate();
  setTimeout(()=>{ const f=$("#hotForm"); if(f) f.scrollIntoView({behavior:"smooth",block:"start"}); }, 50);
}
function closeHotForm(){ HOT_EDIT=null; renderHotUpdate(); }
function hotKeyChanged(v){
  if(!HOT_EDIT || HOT_EDIT.id) return;
  HOT_EDIT.key=v.trim().toLowerCase();
  HOT_EDIT.value=hotDefaultValue(HOT_EDIT.key);
  if(HOT_EDIT.key==="maintenance") HOT_EDIT.category="maintenance";
  else if(HOT_EDIT.key==="home_announcement") HOT_EDIT.category="notice";
  else if(HOT_EDIT.key==="feature_flags") HOT_EDIT.category="flag";
  renderHotUpdate();
  setTimeout(()=>{ const el=$("#hyKey"); if(el) el.focus(); }, 30);
}
function hotVal(id){ const el=$("#"+id); return el?el.value:""; }
function hotChecked(id){ const el=$("#"+id); return !!(el&&el.checked); }
function hotCollectValue(){
  const key=HOT_EDIT.key;
  if(key==="maintenance") return {enabled:hotChecked("hyMaintOn"),title:hotVal("hyMaintTitle").trim(),message:hotVal("hyMaintMessage").trim(),eta:hotVal("hyMaintEta").trim()};
  if(key==="home_announcement") return {enabled:hotChecked("hyAnnOn"),id:hotVal("hyAnnId").trim(),badge:hotVal("hyAnnBadge").trim(),title:hotVal("hyAnnTitle").trim(),body:hotVal("hyAnnBody").trim(),actionText:hotVal("hyAnnActionText").trim(),actionUrl:hotVal("hyAnnActionUrl").trim(),dismissible:hotChecked("hyAnnDismiss")};
  if(key==="feature_flags"){
    // 保留表单里没展示的旧开关（comments / dm / 自定义 key），只覆盖有复选框的项。
    const out={...(HOT_EDIT.value||{})};
    ["shorts","apps","post","inline_text_emoji"].forEach(k=>{ const el=$("#hyFlag_"+k); if(el) out[k]=!!el.checked; });
    return out;
  }
  const raw=(hotVal("hyValueJson")||"").trim();
  if(!raw) return {};
  try{ return JSON.parse(raw); }catch(e){ throw new Error("JSON 格式不正确："+e.message); }
}
async function saveHotConfig(){
  if(!HOT_EDIT) return;
  const typedKey=(hotVal("hyKey")||"").trim().toLowerCase();
  if(!typedKey) return toast("请填写配置键",1);
  if(typedKey!==HOT_EDIT.key){
    toast("配置键已修改，请先点右侧「应用」加载对应编辑模板",1);
    return;
  }
  HOT_EDIT.key=typedKey;
  if(!/^[a-z][a-z0-9_.-]{1,63}$/.test(HOT_EDIT.key)) return toast("配置键需小写字母开头，仅含小写字母/数字/._-",1);
  let value;
  try{ value=hotCollectValue(); }catch(e){ return toast(e.message,1); }
  const starts=hotVal("hyStartsAt"), ends=hotVal("hyEndsAt");
  const body={id:HOT_EDIT.id||"", key:HOT_EDIT.key, category:hotVal("hyCategory")||"config",
    platform:hotVal("hyPlatform")||"all", channel:hotVal("hyChannel")||"stable", valueType:"json",
    value:value, description:hotVal("hyDescription").trim(), status:Number(hotVal("hyStatus")||0)===1?1:0,
    priority:Number(hotVal("hyPriority")||0), minBuild:Number(hotVal("hyMinBuild")||0),
    maxBuild:Number(hotVal("hyMaxBuild")||0), rollout:Number(hotVal("hyRollout")||100),
    startsAt:starts?Math.floor(new Date(starts).getTime()/1000):0,
    endsAt:ends?Math.floor(new Date(ends).getTime()/1000):0};
  if(body.status===1 && HOT_EDIT.key==="maintenance" && !value.enabled && !confirm("维护开关未打开，这条配置不会拦截用户。仍要保存吗？")) return;
  try{
    const r=await api("POST","/admin/hot-update/configs",body);
    toast("热更新配置已保存 · revision "+r.revision);
    HOT_EDIT=null;
    await viewHotUpdate();
  }catch(e){ toast(e.message,1); }
}
async function toggleHotConfig(id){
  const it=(HOT.items||[]).find(x=>x.id===id); if(!it) return;
  const next=it.status===1?0:1;
  if(next===1 && !confirm("启用后，符合平台/渠道/build 与灰度的客户端会立即收到该配置，确定吗？")) return;
  try{ await api("POST","/admin/hot-update/configs/"+encodeURIComponent(id)+"/toggle",{status:next});
    toast(next===1?"配置已生效":"配置已停用"); await viewHotUpdate(); }catch(e){ toast(e.message,1); }
}
async function deleteHotConfig(id){
  const it=(HOT.items||[]).find(x=>x.id===id); if(!it) return;
  if(!confirm("删除配置 "+it.key+"（"+HOT_PF[it.platform]+"）？历史版本会保留，但当前配置立即消失。")) return;
  try{ await api("DELETE","/admin/hot-update/configs/"+encodeURIComponent(id)); toast("配置已删除"); await viewHotUpdate(); }catch(e){ toast(e.message,1); }
}
async function toggleHotMaster(){
  const next=!HOT.master;
  if(!next && !confirm("紧急熔断后，Android 与 iOS 的所有热更新配置立即停止下发。确定关闭？")) return;
  try{ await api("POST","/admin/hot-update/master",{enabled:next});
    toast(next?"热更新已恢复":"热更新已熔断"); await viewHotUpdate(); }catch(e){ toast(e.message,1); }
}
async function showHotHistory(id){
  const it=(HOT.items||[]).find(x=>x.id===id); if(!it) return;
  try{
    const j=await api("GET","/admin/hot-update/configs/"+encodeURIComponent(id)+"/revisions");
    const rows=(j.items||[]).map(r=>{
      const wt=fmt(r.created);
      let summary="";
      try{ summary=JSON.stringify((r.snapshot&&r.snapshot.value)||{}); }catch(e){ summary="—"; }
      return `<div class="hot-hist-row"><div><b>rev ${r.revision}</b><small>${esc(wt)}</small></div>
        <div><p title="${esc(summary)}">${esc(summary)}</p><small>${esc(HOT_ACTION[r.action]||r.action)} · ${esc(r.admin||"")}</small></div>
        <button class="btn mini" onclick="rollbackHot('${esc(id)}',${r.revision})">回滚</button></div>`;
    }).join("");
    openDlg("配置历史 · "+it.key, `<div class="hot-hist">${rows||'<div class="empty">暂无历史版本</div>'}</div>`);
  }catch(e){ toast(e.message,1); }
}
async function rollbackHot(id,rev){
  if(!confirm("回滚到 rev "+rev+"？会生成一条新 revision，并立即对线上生效。")) return;
  try{ const r=await api("POST","/admin/hot-update/configs/"+encodeURIComponent(id)+"/rollback",{revision:rev});
    closeDlg(); toast("已回滚 · revision "+r.revision); await viewHotUpdate(); }catch(e){ toast(e.message,1); }
}

  openDlg("下发预览", `<div class="hot-preview-grid">
    <div class="row"><label>平台</label><select id="hpPlatform"><option value="ios">iOS</option><option value="android">Android</option></select></div>
    <div class="row"><label>渠道</label><select id="hpChannel"><option value="stable">stable</option><option value="beta">beta</option><option value="internal">internal</option></select></div>
    <div class="row"><label>Build</label><input id="hpBuild" type="number" value="118"></div>
  </div><div class="apprel-form-actions" style="margin:0 0 10px"><button class="btn p mini" onclick="runHotPreview()">拉取预览</button></div>
  <pre class="hot-preview-pre" id="hotPreviewPre">选择平台与 build 后点击「拉取预览」。</pre>`);

function pickSiteImage(path){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="image/png,image/jpeg,image/webp,image/gif";
  inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 10*1024*1024) return toast("图片不能超过 10MB",1);
    const fd = new FormData(); fd.append("file", f);
    try{
      const r = await fetch(API+"/admin/upload-image", {method:"POST", headers:{"X-Community-Admin-Token":TOK}, body:fd});
      let j={}; try{ j=await r.json(); }catch(e){}
      if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
      const el = document.querySelector(`[data-site-field="${path}"]`); if(el) el.value = j.url;
      const th = document.querySelector(`[data-site-thumb="${path}"]`); if(th){ th.src=j.url; th.style.display=""; }
      toast("图片已上传，记得保存");
    }catch(e){ toast(e.message,1); }
  };
  inp.click();
}

                   : `<span class="tag t-warn">还没用过工坊</span>`}`;

async function afGrant(forceCreate){
  const raw = (($("#af_q")||{}).value || "").trim();
  const yuan = parseFloat((($("#af_yuan")||{}).value || "0"));
  const gift = parseInt((($("#af_gift")||{}).value || "0"), 10);
  if(!raw) return toast("先填 uid / 账号 / 昵称", 1);
  if(!(yuan > 0) && !(gift > 0)) return toast("充值或赠送至少填一项", 1);
  try{
    const j = await api("POST", "/admin/af/grant", {uid: raw, yuan, gift, create: !!forceCreate});
    toast(`已调整 ${j.name || raw}：充值 ¥${j.yuan} · 赠送 ${j.gift} token`);
    closeDlg();
    AF_LOOK = null;
    viewAfUsers();

    if(/还没用过工坊/.test(e.message)){
      openDlg("这个用户还没用过工坊", `

      toast(e.message, 1);
    }
  }
}

async function uploadBannerFile(input){
  const file = input.files[0];
  if(!file) return;
  if(file.size > 10*1024*1024) return toast("图片不能超过 10MB",1);
  const fd = new FormData();
  fd.append("file", file);
  $("#upStatus").textContent = "上传中…";
  try{
    const r = await fetch(API+"/admin/upload-image",
      {method:"POST", headers:{"X-Community-Admin-Token":TOK}, body:fd});
    let j={}; try{ j = await r.json(); }catch(e){}
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
    $("#bi").value = j.name;
    const pv = $("#bannerPreview");
    pv.src = j.url;
    $("#upStatus").textContent = "上传成功";
    toast("图片上传成功");
  }catch(e){ $("#upStatus").textContent=""; toast(e.message,1); }
}

async function saveBanner(){
  const image = $("#bi").value.trim();
  if(!image) return toast("请上传图片或填写图片地址",1);
  const linkType = $("#bl").value;
  const linkId = $("#blink").value.trim();
  if(linkType==="url" && linkId && !/^https?:\/\//i.test(linkId))
    return toast("外链必须以 http:// 或 https:// 开头",1);
  if(linkType==="url" && !linkId)
    return toast("外链不能为空；不想跳转请选「不跳转」",1);
  if(["post","topic","user","app"].includes(linkType) && !linkId)
    return toast("请填写跳转目标",1);
  const body = {
    image,
    title: $("#btitle").value.trim(),
    linkType,
    linkId,
    sort: parseInt($("#bsort").value||"0",10)||0,
    active: $("#bactive").value==="1"?1:0
  };
  try{
    if(_bannerEditing){
      await api("PUT", "/admin/banners/"+_bannerEditing, body);
      toast("已更新");
    }else{
      await api("POST", "/admin/banners", body);
      toast("已创建");
    }
    closeDlg(); go("banners");
  }catch(e){ toast(e.message,1); }
}

async function saveBannerFallback(){
  const title = $("#fbTitle").value.trim();
  const subtitle = $("#fbSubtitle").value.trim();
  const linkType = $("#fbType").value;
  const linkId = $("#fbLink").value.trim();
  if(linkType==="url" && !linkId) return toast("外链不能为空",1);
  if(linkType==="url" && !/^https?:\/\//i.test(linkId))
    return toast("外链必须以 http:// 或 https:// 开头",1);
  if(["post","topic","user","app"].includes(linkType) && !linkId)
    return toast("请填写跳转目标",1);
  try{
    await api("PUT", "/admin/banner-settings", {
      enabled: $("#fbEnabled").value==="1"?1:0,
      title, subtitle, linkType, linkId
    });
    toast("运营卡已保存");
  }catch(e){ toast(e.message,1); }
}

async function reviewWithdraw(id, action){
  const label = action==="approve" ? "通过" : action==="reject" ? "拒绝" : "标记已打款";
  let note = prompt(label + "这笔提现？可填写审核备注（可留空）", "");
  if(note === null) return;
  let transfer_ref = "";
  if(action === "paid"){
    transfer_ref = prompt("填写转账单号或打款备注（可留空）", "");
    if(transfer_ref === null) return;
  }
  try{
    await api("POST", "/invite/admin/review", {id, action, note, transfer_ref});
    toast("已" + label);
    go("invites");
  }catch(e){ toast(e.message, 1); }
}

async function openWithdrawQr(id){
  try{
    const r = await fetch(API + "/invite/admin/qr?id=" + encodeURIComponent(id),
      {headers:{"X-Community-Admin-Token":TOK}});
    if(!r.ok) throw new Error("收款码不存在或无权查看");
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast(e.message, 1); }
}
