name: build-community
on:
  push:
    branches: [main, ui/immersive-black]
  workflow_dispatch:

jobs:
  # ---------- 启动图：CI 用 tool/make_splash.py 渲染（与本地同一脚本/同一字体） ----------
  splash-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          ls -la /usr/share/fonts/opentype/noto/ | head -20

      - name: Install python deps
        run: python3 -m pip install --quiet pillow==10.4.0 fonttools

      - name: Render splash images
        run: python3 tool/make_splash.py

      - uses: actions/upload-artifact@v4
        with:
          name: splash-ios
          path: ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png

  # ---------- Android APK ----------
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install python deps
        run: python3 -m pip install --quiet pillow==10.4.0 fonttools

      - name: Render splash images
        run: python3 tool/make_splash.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: community-android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # ---------- iOS 未签名 IPA（无开发者证书，可 sideload / 自签） ----------
  ios-unsigned-ipa:
    needs: splash-assets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rendered LaunchImage
        uses: actions/download-artifact@v4
        with:
          name: splash-ios
          path: ios/Runner/Assets.xcassets/LaunchImage.imageset

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 镜像自带最新 Xcode（video_player_avfoundation 需 Swift 6 并发语法支持）
      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        run: |
          APP=$(find build/ios/iphoneos -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r community-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: community-ios-unsigned-ipa
          path: build/ios/ipa/community-unsigned.ipa
