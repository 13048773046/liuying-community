name: build-community
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v41 source patches
        run: |
          set -e
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/DVponpR5Rw" -o /tmp/base.zip
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/MJuEas34Ol" -o /tmp/v36.zip
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/1ZGl8c9Zni" -o /tmp/v39.zip
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/cPJMhHTVAK" -o /tmp/v40.zip
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/gpNrN3OQ8r" -o /tmp/v41.zip
          unzip -oq /tmp/base.zip -d "$GITHUB_WORKSPACE"
          unzip -oq /tmp/v36.zip -d "$GITHUB_WORKSPACE"
          unzip -oq /tmp/v39.zip -d "$GITHUB_WORKSPACE"
          unzip -oq /tmp/v40.zip -d "$GITHUB_WORKSPACE"
          unzip -oq /tmp/v41.zip -d "$GITHUB_WORKSPACE"
          grep -q 'version: 0.8.5+69' "$GITHUB_WORKSPACE/pubspec.yaml"
          grep -q 'north_east_rounded' "$GITHUB_WORKSPACE/lib/pages/mine/mine_entry_section.dart"
          grep -q '数据四项：直接落在画布上' "$GITHUB_WORKSPACE/lib/pages/mine/mine_page.dart"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: community-android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish APK to dist-apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pubapk && cd /tmp/pubapk
          git init -q -b dist-apk
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          cp "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk" ./community-v41.apk
          git add -A
          git commit -q -m "publish apk v41"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-apk

  ios-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        run: |
          APP=$(find build/ios/iphoneos -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r community-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: community-ios-unsigned-ipa
          path: build/ios/ipa/community-unsigned.ipa