name: Build 0.9.52 iOS unsigned IPA

on:
  push:
    branches: [build-0.9.52]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - name: Download source package
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 --max-time 180 \
            https://www.dbmt999.asia/ci/liuying-0.9.52-src.tar.gz \
            -o liuying-0.9.52-src.tar.gz
          mkdir -p src
          tar -xzf liuying-0.9.52-src.tar.gz -C src
          test -f src/pubspec.yaml
          grep -q 'version: 0.9.52+123' src/pubspec.yaml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Flutter doctor
        run: flutter --version && flutter doctor -v

      - name: Resolve dependencies
        working-directory: src
        run: flutter pub get

      - name: Pod install
        working-directory: src/ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        working-directory: src
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry ../ipa/liuying-community-0.9.52-unsigned.ipa Payload
          cd ..
          ls -lh ipa/liuying-community-0.9.52-unsigned.ipa
          shasum -a 256 ipa/liuying-community-0.9.52-unsigned.ipa | tee ipa/SHA256-0.9.52.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-ios-0.9.52-unsigned-ipa
          path: |
            src/build/ios/ipa/liuying-community-0.9.52-unsigned.ipa
            src/build/ios/ipa/SHA256-0.9.52.txt
          if-no-files-found: warn
          retention-days: 30
