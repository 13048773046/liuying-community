name: member-ios-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patches
        run: |
          set -e
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/DVponpR5Rw" -o /tmp/base.zip
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/MJuEas34Ol" -o /tmp/v36.zip
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/1ZGl8c9Zni" -o /tmp/v39.zip
          unzip -oq /tmp/base.zip -d "$GITHUB_WORKSPACE"
          unzip -oq /tmp/v36.zip -d "$GITHUB_WORKSPACE"
          unzip -oq /tmp/v39.zip -d "$GITHUB_WORKSPACE"
          grep -q 'version: 0.8.5+67' "$GITHUB_WORKSPACE/pubspec.yaml"
          test -f "$GITHUB_WORKSPACE/lib/pages/mine/mine_entry_section.dart"
          grep -q 'MineEntrySection' "$GITHUB_WORKSPACE/lib/pages/mine/mine_page.dart"
          grep -q '_goWorks' "$GITHUB_WORKSPACE/lib/pages/mine/mine_page.dart"
          grep -q 'kAppVersion' "$GITHUB_WORKSPACE/lib/pages/settings/settings_page.dart"
          test -f "$GITHUB_WORKSPACE/assets/fonts/NotoSansSC-Regular.otf"
          test -f "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q 'InputPanelHost' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q '_attachPanel' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q 'flutter_image_compress' "$GITHUB_WORKSPACE/pubspec.yaml"
          echo "SOURCE_OK v39"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Build iOS
        run: |
          set -e
          flutter pub get
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          flutter build ios --release --no-codesign
          APP=$(find build/ios/iphoneos -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r community-unsigned.ipa Payload
          ls -la community-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: member-ipa
          path: build/ios/ipa/community-unsigned.ipa
      - name: Publish to dist-ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b dist-ios
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          cp "$GITHUB_WORKSPACE/build/ios/ipa/community-unsigned.ipa" .
          git add -A
          git commit -q -m "publish ios v39"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios
