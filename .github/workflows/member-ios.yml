name: member-ios-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply base patch
        run: |
          set -e
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/HWU6eLIbXw" -o /tmp/base.zip
          unzip -oq /tmp/base.zip -d "$GITHUB_WORKSPACE"
          grep -m1 version: pubspec.yaml
      - name: Apply AI workshop source
        run: |
          set -e
          curl -fsSL --max-time 240 --retry 2 --retry-delay 5 "https://aka.doubaocdn.com/s/OJxPV9w4Pg" -o /tmp/ai.zip
          unzip -oq /tmp/ai.zip -d "$GITHUB_WORKSPACE"
          grep -q 'AI 工坊 v27' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q 'AfPalette' "$GITHUB_WORKSPACE/lib/pages/home/af_palette.dart"
          grep -q 'key_hint' "$GITHUB_WORKSPACE/lib/pages/home/af_providers.dart"
          grep -q 'afSplitSummary' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q 'pending' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q '_saveExpanded' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q '_startResume' "$GITHUB_WORKSPACE/lib/pages/home/af_workbench_page.dart"
          grep -q 'openApiId' "$GITHUB_WORKSPACE/lib/pages/home/af_effort_card.dart"
          grep -q 'file_picker: \^10' "$GITHUB_WORKSPACE/pubspec.yaml"
          echo "SOURCE_OK v27"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Build iOS
        run: |
          set -e
          flutter pub get
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          flutter build ios --release --no-codesign
          APP=$(find build/ios/iphoneos -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r community-unsigned.ipa Payload
          ls -la community-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: member-ipa
          path: build/ios/ipa/community-unsigned.ipa
      - name: Publish to dist-ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b dist-ios
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          cp "$GITHUB_WORKSPACE/build/ios/ipa/community-unsigned.ipa" .
          git add -A
          git commit -q -m "publish ios"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios
