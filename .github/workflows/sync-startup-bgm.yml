name: sync-startup-bgm
# 一次性同步器：修「打开 App 就自动放配乐」（后台 Tab 的图文卡误起播），md5 校验后提交并 dispatch 构建。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-startup-bgm.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/immersive-black

      - name: Download and verify
        run: |
          set -e
          curl -fsSL https://aka.doubaocdn.com/s/4FU7QibUMe -o lib/pages/shorts/video_card.dart
          md5sum -c <<'EOF'
          ce0755a8f4bb508da638a8048c410882  lib/pages/shorts/video_card.dart
          EOF

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-sync"
          git config user.email "ci-sync@users.noreply.github.com"
          git add lib
          git commit -m "fix(shorts): 后台 Tab 不再误起播配乐（tickerEnabled 初值保守 + 首帧后再同步）" || echo "no change"
          git push origin HEAD:ui/immersive-black

      - name: Trigger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref ui/immersive-black || echo "dispatch failed"
