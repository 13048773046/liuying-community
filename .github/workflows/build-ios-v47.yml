name: build-ios-v47

on:
  push:
    branches: [ios-v47-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-unsigned:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Replace with latest source bundle
        run: |
          set -euo pipefail
          curl --http1.1 -fL --retry 3 --retry-delay 2 --connect-timeout 20 'https://aka.doubaocdn.com/s/Yo5TbZVqmb' -o /tmp/src.zip
          unzip -tq /tmp/src.zip >/dev/null
          rm -rf lib ios assets pubspec.yaml pubspec.lock third_party shorebird.yaml
          unzip -oq /tmp/src.zip -d "$GITHUB_WORKSPACE"
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f third_party/video_thumbnail/pubspec.yaml
          test -f shorebird.yaml
          grep -n 'DEVELOPMENT_TEAM' ios/Runner.xcodeproj/project.pbxproj
          grep -n '^version:' pubspec.yaml
          grep -n 'kAppVersion' lib/config.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Build iOS unsigned
        id: build
        run: |
          set -euo pipefail
          flutter pub get
          set +e
          flutter build ios --release --no-codesign
          FLUTTER_STATUS=$?
          set -e
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app produced (flutter exit $FLUTTER_STATUS)"
            exit 1
          fi
          if [ "$FLUTTER_STATUS" -ne 0 ]; then
            echo "::warning::flutter build exited $FLUTTER_STATUS but produced $APP; packaging unsigned IPA"
          fi
          IOS_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          IOS_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "IPA version=$IOS_VERSION build=$IOS_BUILD"
          echo "IOS_VERSION=$IOS_VERSION" >> "$GITHUB_OUTPUT"
          echo "IOS_BUILD=$IOS_BUILD" >> "$GITHUB_OUTPUT"
          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/*
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr "liuying-community-${IOS_VERSION}-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: liuying-community-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa)
          VERSION="${{ steps.build.outputs.IOS_VERSION }}"
          BUILD="${{ steps.build.outputs.IOS_BUILD }}"
          TAG="ios-v${VERSION}-${BUILD}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "流萤社区 iOS ${VERSION} (${BUILD})" \
              --notes "Unsigned IPA. Built from ${GITHUB_SHA}. Version ${VERSION}, build ${BUILD}."
          fi
          gh release upload "$TAG" "$IPA" --clobber --repo "$GITHUB_REPOSITORY"
          echo "release asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$IPA")"

      - name: Publish IPA to dist-ios-v47 branch (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/pubios && cd /tmp/pubios
          git init -q -b dist-ios-v47
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/build/ios/ipa/"*.ipa .
          sha256sum *.ipa > SHA256.txt
          ls -lh
          git add -A
          git commit -q -m "publish ios 0.9.59+130"
          if ! git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios-v47; then
            echo "dist push failed, retrying once"
            sleep 8
            git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios-v47 || \
              echo "dist push failed; durable IPA is on the GitHub Release"
          fi
