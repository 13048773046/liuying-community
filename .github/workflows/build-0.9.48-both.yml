name: build-community-0.9.48-both

on:
  push:
    branches: [build-0.9.48-both]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Fetch and run Android build script
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
            https://www.dbmt999.asia/ci/ci-android-0.9.48.sh -o /tmp/ci-android.sh
          bash /tmp/ci-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-android-0.9.48-apk
          path: |
            build/app/outputs/flutter-apk/community-0.9.48.apk
            build/app/outputs/flutter-apk/SHA256.txt
            ci-android-0.9.48.log
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Fetch and run iOS build script
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
            https://www.dbmt999.asia/ci/ci-ios-0.9.48.sh -o /tmp/ci-ios.sh
          bash /tmp/ci-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-ios-0.9.48-unsigned-ipa
          path: |
            build/ios/ipa/community-unsigned-0.9.48.ipa
            build/ios/ipa/community-unsigned.ipa
            build/ios/ipa/SHA256.txt
            ci-ios-0.9.48.log
          if-no-files-found: warn
