name: apply-ui
on:
  push:
    branches: [ui/immersive-black]
    paths: ['.github/workflows/apply-ui.yml']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/immersive-black
          fetch-depth: 1
      - name: Cancel stale builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow build.yml --limit 10 --json databaseId,status \
            --jq '.[] | select(.status=="queued" or .status=="in_progress") | .databaseId' \
            | while read id; do [ -n "$id" ] && gh run cancel "$id" || true; done
      - name: Apply patch
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/bSeTylPk7o" -o /tmp/p.zip
          unzip -o /tmp/p.zip -d .
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "apply ui v17 0.5.1 retry ios" || echo "no changes"
          git push origin HEAD:ui/immersive-black
      - name: Trigger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref ui/immersive-black
