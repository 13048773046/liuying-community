# rebuild 2026-11-24: 0.9.59 three-state home pull gap (refresh hold / second floor)
name: build-community-0.9.59-ios
on:
  push:
    branches: [build-0.9.50-both]
    paths: ['.github/workflows/build-0.9.59-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - name: Fetch 0.9.54 source base and 0.9.59 patch
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --max-time 300 \
            https://www.dbmt999.asia/community_app_src.tgz -o /tmp/base.tgz
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
            https://www.dbmt999.asia/community/files/ci/ios_patch_0.9.59.tar.gz -o /tmp/patch.tgz
          test "$(stat -f%z /tmp/base.tgz)" -gt 50000000
          test "$(stat -f%z /tmp/patch.tgz)" -gt 100000
          tar -xzf /tmp/base.tgz -C "$GITHUB_WORKSPACE"
          tar -xzf /tmp/patch.tgz -C "$GITHUB_WORKSPACE"
          grep '^version:' pubspec.yaml
          grep "kAppVersion" lib/config.dart | head -1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Build iOS unsigned IPA
        run: |
          set -o pipefail
          flutter pub get
          flutter build ios --release --no-codesign
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "APP=$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry community-ipa-0.9.59-unsigned.ipa Payload
          shasum -a 256 community-ipa-0.9.59-unsigned.ipa | tee SHA256.txt
          unzip -l community-ipa-0.9.59-unsigned.ipa | grep 'Payload/.*\.app/Info.plist'
          ls -lh community-ipa-0.9.59-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: community-ios-0.9.59-unsigned-ipa
          path: |
            build/ios/ipa/community-ipa-0.9.59-unsigned.ipa
            build/ios/ipa/SHA256.txt
          if-no-files-found: error

      - name: Publish IPA to dist-ios-0.9.59
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pubios && cd /tmp/pubios
          cp "$GITHUB_WORKSPACE/build/ios/ipa/community-ipa-0.9.59-unsigned.ipa" .
          cp "$GITHUB_WORKSPACE/build/ios/ipa/SHA256.txt" .
          git init -q -b dist-ios-0.9.59
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "publish ios 0.9.59 unsigned"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios-0.9.59
