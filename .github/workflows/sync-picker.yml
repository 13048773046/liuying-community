name: sync-picker-code
# 一次性同步器：把本地已验证的「选配乐分页」改动经公开 CDN 写回仓库（md5 校验），
# 提交后主动 dispatch build.yml（GITHUB_TOKEN 的 commit 不会触发 push 事件）。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-picker.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/immersive-black

      - name: Download and verify
        run: |
          set -e
          get() { curl -fsSL "$1" -o "$2"; }
          get https://aka.doubaocdn.com/s/QfQvI4kVOU lib/api/client.dart
          get https://aka.doubaocdn.com/s/0hKUfarM6a lib/pages/post/music_picker_sheet.dart
          md5sum -c <<'EOF'
          8d66a5f7decf177496f1abd8a698faf7  lib/api/client.dart
          70f89f88b0759a5f393f51be69046702  lib/pages/post/music_picker_sheet.dart
          EOF

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-sync"
          git config user.email "ci-sync@users.noreply.github.com"
          git add lib
          git commit -m "feat(picker): 选配乐弹层分页加载（服务端搜索+滚动加载更多，曲库310首）" || echo "no change"
          git push origin HEAD:ui/immersive-black

      - name: Trigger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref ui/immersive-black || echo "dispatch failed"
