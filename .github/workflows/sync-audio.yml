name: sync-audio-code
# 一次性同步器：把本地已验证的 dart 文件经公开 CDN 写回仓库（md5 校验，避免长文本转录损坏）
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-audio.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/immersive-black

      - name: Download and verify
        run: |
          set -e
          get() { curl -fsSL "$1" -o "$2"; }
          get https://aka.doubaocdn.com/s/aVDZe2IAUc lib/models/feed_item.dart
          get https://aka.doubaocdn.com/s/Peb4MPaklO lib/utils/music_bgm.dart
          get https://aka.doubaocdn.com/s/mPbVIu11iO lib/pages/shorts/video_card.dart
          get https://aka.doubaocdn.com/s/2Q9Wjlpuaz lib/pages/post/post_editor.dart
          get https://aka.doubaocdn.com/s/19dO5kti7f test/video_loop_restart_test.dart
          get https://aka.doubaocdn.com/s/WCIYT04RGA test/feed_item_audio_volume_test.dart
          md5sum -c <<'EOF'
          764b6aaea71983c9c9cb9d504b3c3908  lib/models/feed_item.dart
          405511d63369738ff7267c51e170f536  lib/utils/music_bgm.dart
          3247f8369036b6529179d2529a742f50  lib/pages/shorts/video_card.dart
          aec1926432080b058d6b1238a2a9a667  lib/pages/post/post_editor.dart
          e9618170cceb10db927c89df0fd48e24  test/video_loop_restart_test.dart
          c8a8bf175eb985c0c8ee747e8e625226  test/feed_item_audio_volume_test.dart
          EOF

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-sync"
          git config user.email "ci-sync@users.noreply.github.com"
          git add lib test
          git commit -m "refactor(audio): 抽出 videoLoopRestartDetected 纯函数并补单测（配乐随视频循环归零/音量字段解析）" || echo "no change"
          git push origin HEAD:ui/immersive-black
