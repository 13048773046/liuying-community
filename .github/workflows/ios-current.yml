name: ios-current-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-unsigned-ipa:
    runs-on: macos-latest
    env:
      SRC_ARCHIVE: https://www.yosar.cloud/ci/liuying-0.9.25-src.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Apply current 0.9.25 source
        run: |
          set -e
          curl -fsSL --max-time 360 --retry 2 "$SRC_ARCHIVE" -o /tmp/src.tgz
          tar -xzf /tmp/src.tgz -C "$GITHUB_WORKSPACE"
          grep -q '^version: 0.9.25+96' pubspec.yaml
          grep -q 'www.yosar.cloud' lib/config.dart
          grep -q 'verifiedOf' lib/models/feed_item.dart
          grep -q 'profile-verified-badge' lib/pages/user/user_profile.dart
          grep -q 'profile-member-badge' lib/pages/user/user_profile.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/ci-ios.log"
          {
            flutter pub get
            echo "== xcode =="
            ls /Applications | grep -i xcode || true
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            test -n "$XCODE" || XCODE=/Applications/Xcode.app
            sudo xcode-select -s "$XCODE/Contents/Developer"
            xcodebuild -version
            echo "== build =="
            flutter build ios --release --no-codesign
            APP=$(find build/ios/iphoneos -name '*.app' | head -1)
            test -n "$APP"
            echo "App: $APP"
            mkdir -p build/ios/ipa/Payload
            cp -R "$APP" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -qr community-unsigned-ipa.zip Payload
            mv community-unsigned-ipa.zip liuying-community-0.9.25-unsigned.ipa
            ls -lh liuying-community-0.9.25-unsigned.ipa
          } 2>&1 | tee -a "$LOG"

      - uses: actions/upload-artifact@v4
        with:
          name: liuying-community-0.9.25-unsigned-ipa
          path: build/ios/ipa/liuying-community-0.9.25-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to dist-ios-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/pubios && cd /tmp/pubios
          git init -q -b dist-ios-current
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          cp "$GITHUB_WORKSPACE/ci-ios.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build/ios/ipa/liuying-community-0.9.25-unsigned.ipa" .
          shasum -a 256 liuying-community-0.9.25-unsigned.ipa > SHA256.txt
          git add -A
          git commit -q -m "publish ios 0.9.25 unsigned ipa"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios-current
