name: build-ios-0.9.44-source

on:
  push:
    branches: [ios-build-0.9.44]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch 0.9.44 source snapshot
        run: |
          set -euo pipefail
          SRC="https://www.dbmt999.asia/ci/liuying-0.9.44-src.tar.gz"
          SHA="0210500a8c4dc2e486087429952c923290bafc3cf5cc0ad42871bbc91889e7e2"
          curl -fsSL --retry 3 --retry-delay 5 --max-time 600 "$SRC" -o /tmp/src.tgz
          echo "$SHA  /tmp/src.tgz" | shasum -a 256 -c -
          tar -xzf /tmp/src.tgz -C "$GITHUB_WORKSPACE"
          grep -q '^version: 0.9.44+115' pubspec.yaml
          grep -q "kAppVersion = '0.9.44'" lib/config.dart
          grep -q 'kAppBuild = 115' lib/config.dart
          test -f lib/pages/post/post_editor.dart
          test -f lib/pages/post/post_detail.dart
          test -f lib/pages/settings/settings_page.dart
          test -f community/handlers/upload.py
          test -f test/message_realtime_badge_e2e_test.dart
          grep -q 'home-bell-dot' lib/pages/home/home_page.dart
          grep -q 'dmUnread' community/handlers/ws.py
          echo "0.9.44 source snapshot extracted and checks passed"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Resolve dependencies and analyze
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build unsigned iOS IPA
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/ci-ios-0.9.44.log"
          {
            echo "== xcode =="
            xcodebuild -version
            echo "== build =="
            flutter build ios --release --no-codesign
            APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
            test -n "$APP"
            echo "App: $APP"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
            mkdir -p build/ios/ipa/Payload
            cp -R "$APP" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -qry community-unsigned-0.9.44.ipa Payload
            cp community-unsigned-0.9.44.ipa community-unsigned.ipa
            shasum -a 256 community-unsigned-0.9.44.ipa > SHA256.txt
            ls -lh community-unsigned-0.9.44.ipa community-unsigned.ipa
            cat SHA256.txt
          } 2>&1 | tee -a "$LOG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-ios-0.9.44-unsigned-ipa
          path: |
            build/ios/ipa/community-unsigned-0.9.44.ipa
            build/ios/ipa/community-unsigned.ipa
            build/ios/ipa/SHA256.txt
            ci-ios-0.9.44.log
          if-no-files-found: warn

      - name: Publish IPA to dist-ios
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pubios
          git clone -q --depth 1 --branch dist-ios "$REPO_URL" /tmp/pubios
          cd /tmp/pubios
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/build/ios/ipa/community-unsigned-0.9.44.ipa" .
          cp "$GITHUB_WORKSPACE/build/ios/ipa/community-unsigned.ipa" .
          cp "$GITHUB_WORKSPACE/build/ios/ipa/SHA256.txt" .
          cp "$GITHUB_WORKSPACE/ci-ios-0.9.44.log" .
          git add -A
          git commit -q -m "publish ios 0.9.44 unsigned ipa" || true
          git push -q origin dist-ios
