name: build-ios-personalized

on:
  push:
    branches: [ci/ios-0-9-29-personalized]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source snapshot
        run: |
          set -euo pipefail
          SRC="https://aka.doubaocdn.com/s/IJwt9NGu2f"
          curl -fL --retry 3 "$SRC" -o /tmp/community-src.zip
          ls -lh /tmp/community-src.zip
          unzip -q /tmp/community-src.zip -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/pubspec.yaml"
          test -f "$GITHUB_WORKSPACE/lib/pages/home/home_page.dart"
          grep -n "version:" "$GITHUB_WORKSPACE/pubspec.yaml" | head -2

      - name: Fetch rendered LaunchImage
        run: |
          set -euo pipefail
          DEST="ios/Runner/Assets.xcassets/LaunchImage.imageset"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist-splash"
          for f in LaunchImage.png LaunchImage@2x.png LaunchImage@3x.png; do
            if curl -fsSL "$BASE/$f" -o "$DEST/$f"; then
              echo "got $f $(wc -c < "$DEST/$f") bytes"
            else
              echo "WARN: $f unavailable, keeping bundled asset"
            fi
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Build iOS
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/ci-ios-personalized.log"
          {
            flutter pub get
            echo "== xcode =="
            ls /Applications | grep -i xcode || true
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
            xcodebuild -version
            echo "== build ios =="
            flutter build ios --release --no-codesign
            echo "== verify app =="
            APP=$(find build/ios/iphoneos -name "*.app" | head -1)
            echo "App: $APP"
            test -n "$APP"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
            echo "== package =="
            rm -rf build/ios/ipa
            mkdir -p build/ios/ipa/Payload
            cp -R "$APP" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -qry liuying-community-0.9.29-unsigned.ipa Payload
            ls -lh liuying-community-0.9.29-unsigned.ipa
            shasum -a 256 liuying-community-0.9.29-unsigned.ipa > SHA256.txt
            cat SHA256.txt
            unzip -l liuying-community-0.9.29-unsigned.ipa | head -20
          } 2>&1 | tee -a "$LOG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-ios-personalized-ipa
          path: |
            build/ios/ipa/liuying-community-0.9.29-unsigned.ipa
            build/ios/ipa/SHA256.txt
            ci-ios-personalized.log
          if-no-files-found: warn

      - name: Publish IPA
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pubios && cd /tmp/pubios
          git init -q -b dist-ios-personalized
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/ci-ios-personalized.log" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build/ios/ipa/liuying-community-0.9.29-unsigned.ipa" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build/ios/ipa/SHA256.txt" . 2>/dev/null || true
          ls -lh
          git add -A
          git commit -q -m "publish ios 0.9.29 personalized" || true
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-ios-personalized
