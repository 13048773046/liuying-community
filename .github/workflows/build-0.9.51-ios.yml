name: build-community-0.9.51-ios

on:
  push:
    branches: [build-0.9.51]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Fetch and run iOS build script
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
            https://www.dbmt999.asia/ci/ci-ios-0.9.51.sh -o /tmp/ci-ios.sh
          bash /tmp/ci-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-ios-0.9.51-unsigned-ipa
          path: |
            build/ios/ipa/community-unsigned-0.9.51.ipa
            build/ios/ipa/community-unsigned.ipa
            build/ios/ipa/SHA256.txt
            ci-ios-0.9.51.log
          if-no-files-found: warn
