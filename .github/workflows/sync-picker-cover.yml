name: sync-picker-cover
# 一次性同步器：选配乐弹层封面修正（/music/files/ 直链）+ 采集曲合并 + 试听失败提示，md5 校验后 dispatch 构建。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-picker-cover.yml'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/immersive-black

      - name: Download and verify
        run: |
          set -e
          curl -fsSL https://aka.doubaocdn.com/s/UuCk2sDufV -o lib/pages/post/music_picker_sheet.dart
          md5sum -c <<'EOF'
          ca33364823847c969bae868497b5ee64  lib/pages/post/music_picker_sheet.dart
          EOF

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-sync"
          git config user.email "ci-sync@users.noreply.github.com"
          git add lib
          git commit -m "fix(picker): 封面改走 /music/files/ 直链、合并采集曲、试听失败显式提示" || echo "no change"
          git push origin HEAD:ui/immersive-black

      - name: Trigger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref ui/immersive-black || echo "dispatch failed"
