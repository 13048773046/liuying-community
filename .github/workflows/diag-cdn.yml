name: diag-cdn
on:
  push:
    branches: [diag-cdn]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe CDN
        run: |
          set +e
          mkdir -p diag
          curl -vL --max-time 90 --retry 2 --retry-delay 2 'https://aka.doubaocdn.com/s/XZUuVUgVSl' -o /tmp/src.zip 2> diag/curl.log
          echo "curl_exit=$?" >> diag/result.txt
          ls -lh /tmp/src.zip >> diag/result.txt 2>&1
          sha256sum /tmp/src.zip >> diag/result.txt 2>&1
          cat diag/result.txt
      - name: Publish diag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add diag
          git commit -q -m 'diag cdn probe' || true
          git push origin HEAD:diag-cdn || true
